# CNB dsh-workbase → GitHub 镜像与发版流水线
#
# push: main 后依次：校验镜像凭据 → 类型/测试/构建门禁 → 发版（semantic-release，
# 仅在配置了 NPM_TOKEN 时执行）→ 对齐本地 branches/tags → git-sync 推送到 GitHub
# → 为本次新打的 tag 创建 GitHub Release。
#
# 目标是精确镜像：GitHub 侧多出的分支/标签会在对齐阶段删掉（git-sync 自身没有 prune）。
# 凭据 GITHUB_USERNAME / GITHUB_TOKEN / NPM_TOKEN 由密钥仓库
# ${CNB_ROOT_SLUG}/secrets 注入，不写进本文件；`.cnb.yml` 本身也照常镜像，
# 两边同一提交的 SHA 保持一致。
#
# 回推 CNB 用流水线临时令牌 CNB_TOKEN（用户名固定 cnb），构建结束自动销毁，
# 不需要额外配置。

.mirror-job: &mirror-job
  name: mirror-to-github
  runner:
    cpus: 2
  imports:
    - https://cnb.cool/${CNB_ROOT_SLUG}/secrets/-/blob/main/secrets.yml
  lock:
    key: mirror-github
    wait: true
    cancel-in-wait: true
  stages:
    # 失败早于推送：token 过期或没把本仓库加进 fine-grained PAT 的 Repository access
    # 时，这里给出可读的原因，而不是让 align 阶段报一个含糊的认证失败。
    - name: check-credentials
      image: node:24
      script: |
        set -eu
        node --input-type=module -e '
        const repo = `${process.env.GITHUB_USERNAME}/${process.env.CNB_REPO_NAME}`;
        const res = await fetch(`https://api.github.com/repos/${repo}`, {
          headers: {
            authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            accept: "application/vnd.github+json",
            "user-agent": "cnb-mirror",
          },
        });
        if (res.status === 404) {
          console.error(`✗ ${repo} 不可见：仓库不存在，或 token 未授权该仓库（fine-grained PAT 需在 Repository access 里加入本仓库）`);
          process.exit(1);
        }
        if (!res.ok) {
          console.error(`✗ GitHub API ${res.status}: ${(await res.text()).slice(0, 300)}`);
          process.exit(1);
        }
        const body = await res.json();
        if (body.permissions && body.permissions.push !== true) {
          console.error(`✗ token 对 ${repo} 没有写入权限（需 Contents: Read and write）`);
          process.exit(1);
        }
        console.log(`✓ ${repo} 可写`);
        '

    - name: test
      image: node:24
      script: |
        set -eu
        npm ci
        npm run typecheck
        npm test
        npm run build

    # 发版：semantic-release 算版本、更新 CHANGELOG 与文档、npm publish、打 tag，
    # 再回推 CNB。没有 NPM_TOKEN 时整段跳过，镜像照常进行，便于先接流水线再接凭据。
    - name: release
      image: node:24
      env:
        CI: 'true'
      script: |
        set -eu
        if [ -z "${NPM_TOKEN:-}" ]; then
          echo "· 未配置 NPM_TOKEN（${CNB_ROOT_SLUG}/secrets），跳过发版"
          exit 0
        fi
        # 发版提交自身也会触发一轮流水线，这里跳过，避免空转
        if printf '%s' "$CNB_COMMIT_MESSAGE_TITLE" | grep -Eq '^文档修改：[0-9]+\.[0-9]+\.[0-9]+ 同步版本标记与变更记录$'; then
          echo "· 这是发版提交本身，跳过发版"
          exit 0
        fi
        git config --global --add safe.directory '*'
        git config user.name "zhileyo"
        git config user.email "zhangxy.live@outlook.com"
        # commit-analyzer 要看到上一个 tag，浅克隆下历史不足会算错版本
        [ "$(git rev-parse --is-shallow-repository)" != "true" ] || git fetch --unshallow
        git fetch --tags --force origin
        git remote set-url origin "https://${CNB_TOKEN_USER_NAME}:${CNB_TOKEN}@${CNB_WEB_HOST}/${CNB_REPO_SLUG}.git"
        npx semantic-release

    # 插件只推工作区里已有的本地 ref：先与 CNB 对齐，再清理 GitHub 侧已删除的 ref。
    - name: align
      image: node:24
      script: |
        set -eu
        git config --global --add safe.directory '*'

        _target="https://github.com/${GITHUB_USERNAME}/${CNB_REPO_NAME}.git"
        _cred='!f() { echo username="$GITHUB_USERNAME"; echo password="$GITHUB_TOKEN"; }; f'

        # 浅克隆推出去会让 GitHub 侧历史残缺
        [ "$(git rev-parse --is-shallow-repository)" != "true" ] || git fetch --unshallow origin

        # 1) 对齐本地 ref（分支和标签都拉到 CNB 的当前状态）
        git fetch origin --prune --update-head-ok \
          '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

        # 2) 校验：本地 ref 与 CNB 逐条一致（SHA 也相同）
        git for-each-ref --format='%(objectname) %(refname)' refs/heads refs/tags | sort > /tmp/local.refs
        git ls-remote --heads --tags origin > /tmp/origin.raw
        grep -vF '^{}' /tmp/origin.raw | tr '\t' ' ' | sort > /tmp/origin.refs
        diff -q /tmp/local.refs /tmp/origin.refs >/dev/null || {
          echo "✗ 本地 ref 与 CNB 不一致：" >&2
          diff /tmp/local.refs /tmp/origin.refs >&2 || true
          exit 1
        }

        # 3) 清理 GitHub 侧 CNB 已不存在的 ref（git-sync 没有 prune）
        git -c credential.helper="$_cred" ls-remote --heads --tags "$_target" > /tmp/target.raw
        cut -f2 /tmp/target.raw | grep -vF '^{}' | sort > /tmp/target.refs
        while read -r _ref; do
          git rev-parse --verify -q "$_ref" >/dev/null && continue
          echo "· 删除 GitHub 上多余 ref: $_ref"
          git -c credential.helper="$_cred" push "$_target" ":$_ref" < /dev/null
        done < /tmp/target.refs

    - name: mirror
      image: tencentcom/git-sync
      settings:
        target_url: https://github.com/${GITHUB_USERNAME}/${CNB_REPO_NAME}.git
        auth_type: https
        username: ${GITHUB_USERNAME}
        password: ${GITHUB_TOKEN}
        force: true
        push_tags: true

    # 镜像完成后 tag 才在 GitHub 上；只给确实发布到 npm 的版本建 Release，
    # 已存在则跳过，因此可以重复执行，也不会把历史 tag 补成 Release。
    - name: publish-release
      image: node:24
      script: |
        set -eu
        git config --global --add safe.directory '*'
        # 发版提交是 release 阶段在流水线里 push 的，本次运行的 HEAD 未必带 tag；
        # 以 CNB 上 main 的最新提交为准，同一轮就能建出 Release。
        git fetch --tags --force origin main
        tag="$(git tag --points-at FETCH_HEAD | sort -V | tail -n 1)"
        if [ -z "$tag" ]; then
          echo "· main 最新提交没有 tag，跳过 GitHub Release"
          exit 0
        fi
        export RELEASED_TAG="$tag"
        node --input-type=module -e '
        const tag = process.env.RELEASED_TAG;
        const version = tag.replace(/^v/, "");
        const repo = `${process.env.GITHUB_USERNAME}/${process.env.CNB_REPO_NAME}`;

        const npm = await fetch(`https://registry.npmjs.org/dsh-workbase/${version}`);
        if (npm.status === 404) {
          console.log(`· npm 上没有 ${version}，跳过 GitHub Release`);
          process.exit(0);
        }
        if (!npm.ok) {
          console.error(`✗ npm registry ${npm.status}`);
          process.exit(1);
        }

        const api = `https://api.github.com/repos/${repo}/releases`;
        const headers = {
          authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
          accept: "application/vnd.github+json",
          "user-agent": "cnb-mirror",
          "content-type": "application/json",
        };
        const existing = await fetch(`${api}/tags/${tag}`, { headers });
        if (existing.ok) {
          console.log(`· GitHub Release ${tag} 已存在，跳过`);
          process.exit(0);
        }
        if (existing.status !== 404) {
          console.error(`✗ 查询 Release 失败：HTTP ${existing.status}`);
          process.exit(1);
        }

        const created = await fetch(api, {
          method: "POST",
          headers,
          body: JSON.stringify({ tag_name: tag, name: tag, draft: false, prerelease: false }),
        });
        if (!created.ok) {
          if (created.status === 422) {
            console.log(`· GitHub Release ${tag} 已存在，跳过`);
            process.exit(0);
          }
          console.error(`✗ 创建 Release 失败：HTTP ${created.status} ${(await created.text()).slice(0, 300)}`);
          process.exit(1);
        }
        console.log(`✓ 已创建 GitHub Release ${tag}`);
        '

main:
  push:
    - *mirror-job
