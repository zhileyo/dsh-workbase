  "button:hover{background:var(--panel)}:focus-visible{outline:2px solid #89929c;outline-offset:2px}h1,h2,p{margin:0}h1{font-size:24px;font-weight:600}h2{font-size:16px;font-weight:600}small{font-size:12px;color:var(--muted)}",
  "svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}",
  ".bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel)}.bar strong{margin-right:auto}.bar label{display:flex;gap:8px;align-items:center;font-size:12px}",
  ".app{container:workbase/inline-size;max-width:1200px;margin:auto}.app.narrow{max-width:360px}.main{padding:32px 24px}.intro{margin:8px 0 24px;color:var(--muted);font-size:12px}",
  ".projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:16px 0 32px}.project{display:block;text-align:left;padding:20px;border-radius:10px;background:var(--dsw-alias-bg-base,var(--surface));transition:transform .3s ease,box-shadow .3s ease}.project:hover,.project:focus-visible{background:var(--dsw-alias-bg-base,var(--surface));border-color:var(--line)}.project:focus-visible{transform:translateY(-4px);box-shadow:0 4px 16px 4px rgba(31,35,41,.03),0 4px 8px rgba(31,35,41,.02),0 2px 4px -4px rgba(31,35,41,.02)}.internal-color .project:is(:hover,:focus-visible) .metric{background:linear-gradient(var(--hover),var(--hover)),color-mix(in srgb,var(--text) 4%,var(--surface))}",
  "@media(hover:hover) and (pointer:fine){.project:hover{transform:translateY(-4px);box-shadow:0 4px 16px 4px rgba(31,35,41,.03),0 4px 8px rgba(31,35,41,.02),0 2px 4px -4px rgba(31,35,41,.02)}}",
  ".project-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}.project small{display:block;margin:8px 0 16px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:color-mix(in srgb,var(--text) 4%,var(--surface));border-radius:8px;padding:8px;text-align:center}.metric b{display:block;font-size:18px;font-weight:600}.metric small{margin:0}",
  ".stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.stat-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:104px;padding:16px;text-align:left;border-radius:12px;background:var(--surface);transition:transform .3s ease,box-shadow .3s ease}.stat-card:is(:hover,:focus-visible){background:var(--surface);border-color:var(--line)}.stat-card strong{font-size:26px;line-height:28px;font-weight:600}.stat-card>svg{position:absolute;top:16px;right:16px;color:var(--muted)}.stat-card small{display:block;padding-right:20px}.stat-card .stat-arrow{position:absolute;bottom:16px;right:16px;opacity:0;transition:opacity .15s}.stat-card:is(:hover,:focus-visible) .stat-arrow{opacity:1}.stat-card:focus-visible{transform:translateY(-4px);box-shadow:0 4px 16px 4px rgba(31,35,41,.03),0 4px 8px rgba(31,35,41,.02),0 2px 4px -4px rgba(31,35,41,.02)}",
  "@media(hover:hover) and (pointer:fine){.stat-card:hover{transform:translateY(-4px);box-shadow:0 4px 16px 4px rgba(31,35,41,.03),0 4px 8px rgba(31,35,41,.02),0 2px 4px -4px rgba(31,35,41,.02)}}",
  ".stats-color .stat-card{transition:background .15s,border-color .15s}.stats-color .stat-card:is(:hover,:focus-visible){transform:none;box-shadow:none;background:color-mix(in srgb,#f1ebfe 28%,var(--surface));border-color:color-mix(in srgb,#8046f3 22%,var(--line))}",
  ".columns{display:grid;grid-template-columns:minmax(0,65fr) minmax(0,35fr);gap:24px}.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.panel-head{display:flex;align-items:center;gap:8px;margin:4px 0 16px}.panel input[type=search]{height:40px;width:100%;margin-bottom:12px}",
  ".row{display:flex;gap:10px;align-items:flex-start;padding:12px 10px;min-height:76px;border-radius:5px;background:transparent;transition:background .15s}.session{border-bottom:1px solid color-mix(in srgb,var(--line) 25%,transparent)}.row:hover,.row:focus-within{background:var(--row-hover)}.row svg{color:var(--muted);margin-top:3px}.copy{min-width:0;flex:1}.title{border:0;padding:0;background:transparent!important;text-align:left;display:block;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;line-height:22px}.meta{display:block;margin-top:6px}.todo{min-height:66px;padding:10px 4px}.todo input{flex:none;margin:4px 2px 0;width:16px;height:16px;accent-color:#737b85}.done .title{text-decoration:line-through;color:var(--muted)}.empty{padding:24px 8px;color:var(--muted);text-align:center;font-size:12px}",
  "@container workbase (max-width:850px){.columns{grid-template-columns:1fr}.projects{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:24px 16px}}",
  "@media(prefers-reduced-motion:reduce){*{transition:none!important}:is(.project,.stat-card):is(:hover,:focus-visible){transform:none}}",
  "\u003c/style>",
  "\u003c/head>",
  "\u003cbody>",
  "\u003cheader class=\"bar\">\u003cstrong>Workbase · 悬停对照\u003c/strong>\u003clabel>项目\u003cselect id=\"scheme\">\u003coption value=\"motion\">仅上浮与阴影（推荐）\u003c/option>\u003coption value=\"color\">上浮与阴影＋内部变色\u003c/option>\u003c/select>\u003c/label>\u003clabel>统计\u003cselect id=\"stats-scheme\">\u003coption value=\"motion\">上浮＋阴影，不变色（推荐）\u003c/option>\u003coption value=\"color\">原方案：悬停变色\u003c/option>\u003c/select>\u003c/label>\u003cbutton id=\"width\" aria-pressed=\"false\">360px面板\u003c/button>\u003c/header>",
  "\u003cdiv class=\"app\" id=\"app\">\u003cmain class=\"main\">",
  "\u003ch1>统计\u003c/h1>\u003cp class=\"intro\">与项目卡片采用相同4px上浮、300ms过渡及轻阴影；保留角落进入箭头，底色、边框和文字保持稳定。\u003c/p>",
  "\u003cdiv class=\"stats-grid\" id=\"stats\">\u003c/div>\u003cp class=\"intro\" id=\"stats-feedback\" aria-live=\"polite\">点击统计卡可查看示例反馈。此处仅展示设计方案。\u003c/p>",
  "\u003ch1>项目总览\u003c/h1>\u003cp class=\"intro\">两种方案均上浮4px、显示轻阴影，过渡300ms。切换方案比较内部统计块保持原色或同步变色的差别。\u003c/p>",
  "\u003cdiv class=\"projects\" id=\"projects\">\u003c/div>",
  "\u003ch1 id=\"project-name\">默认工作区\u003c/h1>\u003cp class=\"intro\">整块面板承载列表，当前行通过灰色悬停底色获得强调。\u003c/p>",
  "\u003cdiv class=\"columns\">",
  "\u003csection class=\"panel\">\u003cheader class=\"panel-head\">\u003ch2>会话\u003c/h2>\u003csmall id=\"session-count\">\u003c/small>\u003c/header>\u003cinput type=\"search\" id=\"session-query\" aria-label=\"搜索会话\" placeholder=\"搜索会话\">\u003cdiv id=\"sessions\">\u003c/div>\u003c/section>",
  "\u003csection class=\"panel\">\u003cheader class=\"panel-head\">\u003ch2>待办\u003c/h2>\u003csmall id=\"todo-count\">\u003c/small>\u003c/header>\u003cinput type=\"search\" id=\"todo-query\" aria-label=\"搜索待办\" placeholder=\"搜索待办\">\u003cdiv id=\"todos\">\u003c/div>\u003c/section>",
  "\u003c/div>",
  "\u003cp class=\"intro\" id=\"feedback\" aria-live=\"polite\">对照原型使用示例数据；待办复选框可切换完成状态。\u003c/p>",
  "\u003c/main>\u003c/div>",
  "\u003cscript>",
  "const DB={",
  "stats:[{label:'运行中',value:0,detail:'暂无运行中',icon:'activity'},{label:'会话',value:14,detail:'最近14天',icon:'message'},{label:'待办',value:2,detail:'手动2 / Agent 0',icon:'check'},{label:'诊断',value:0,detail:'检查正常',icon:'shield'}],",
  "projects:[{name:'默认工作区',recent:11,pending:4,archived:3},{name:'工作台插件',recent:8,pending:2,archived:6},{name:'知识整理',recent:5,pending:2,archived:1}],",
  "sessions:['优化待办详情的信息层级','统一弹窗底部按钮规格','整理附件上传与会话交接流程','调整项目卡片的悬停反馈','补充工作台共用设计规范','修复优先级筛选文案溢出','完善备份恢复提示','梳理会话列表的状态展示'].map((title,i)=>({title,time:`今天 ${19-i}:24`})),",
  "todos:['统一浅色卡片的悬停配色','恢复会话与待办连续列表','整理弹窗交互规范','完善附件失败提示','优化项目统计字段','更新数据备份说明','收紧详情页信息布局','梳理会话草稿格式'].map((title,i)=>({title,priority:['高','中','低','未设置'][i%4],done:i>5}))};",
  "const $=id=>document.getElementById(id);",
  "const icons={folder:'\u003cpath d=\"m6 14 1.5-3h14l-3 9H3V5a2 2 0 0 1 2-2h3l2 3h8a2 2 0 0 1 2 2v3\"/>',message:'\u003cpath d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"/>',activity:'\u003cpath d=\"M22 12h-4l-3 9-6-18-3 9H2\"/>',check:'\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"m8 12 3 3 5-6\"/>',shield:'\u003cpath d=\"M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z\"/>\u003cpath d=\"m9 12 2 2 4-4\"/>',arrow:'\u003cpath d=\"M7 7h10v10M7 17 17 7\"/>'};",
  "const icon=name=>`\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">${icons[name]}\u003c/svg>`;",
  "const state={scheme:'motion',statsScheme:'motion',narrow:false,project:0};",
  "function renderStats(){",
  " $('stats').innerHTML=DB.stats.map((s,i)=>`\u003cbutton class=\"stat-card\" data-stat=\"${i}\" aria-label=\"查看${s.label}明细\">${icon(s.icon)}\u003csmall>${s.label}\u003c/small>\u003cstrong>${s.value}\u003c/strong>\u003csmall>${s.detail}\u003c/small>\u003cspan class=\"stat-arrow\">${icon('arrow')}\u003c/span>\u003c/button>`).join('');",
  "}",
  "function renderProjects(){",
  " $('projects').innerHTML=DB.projects.map((p,i)=>`\u003cbutton class=\"project\" data-project=\"${i}\" aria-pressed=\"${state.project===i}\">\u003cspan class=\"project-title\">${icon('folder')}${p.name}\u003c/span>\u003csmall>项目目录 · 最近活动今天\u003c/small>\u003cspan class=\"metrics\">${[['近期活跃',p.recent],['待办',p.pending],['归档',p.archived]].map(([label,value])=>`\u003cspan class=\"metric\">\u003cb>${value}\u003c/b>\u003csmall>${label}\u003c/small>\u003c/span>`).join('')}\u003c/span>\u003c/button>`).join('');",
  "}",
  "function renderLists(){",
  " const sessions=DB.sessions.filter(s=>s.title.includes($('session-query').value.trim()));",
  " const todos=DB.todos.map((t,i)=>({...t,index:i})).filter(t=>t.title.includes($('todo-query').value.trim()));",
  " $('session-count').textContent=sessions.length;",
  " $('todo-count').textContent=todos.filter(t=>!t.done).length+' 待处理';",
  " $('sessions').innerHTML=sessions.map(s=>`\u003cdiv class=\"row session\">${icon('message')}\u003cdiv class=\"copy\">\u003cbutton class=\"title\" title=\"${s.title}\" data-session=\"${s.title}\">${s.title}\u003c/button>\u003csmall class=\"meta\">${s.time} · 未归档\u003c/small>\u003c/div>\u003c/div>`).join('')||'\u003cp class=\"empty\">没有匹配会话\u003c/p>';",
  " $('todos').innerHTML=todos.map(t=>`\u003cdiv class=\"row todo ${t.done?'done':''}\">\u003cinput type=\"checkbox\" data-todo=\"${t.index}\" ${t.done?'checked':''} aria-label=\"完成${t.title}\">\u003cdiv class=\"copy\">\u003cspan class=\"title\" title=\"${t.title}\">${t.title}\u003c/span>\u003csmall class=\"meta\">${t.priority} · 手动创建 · 今天\u003c/small>\u003c/div>\u003c/div>`).join('')||'\u003cp class=\"empty\">没有匹配待办\u003c/p>';",
  "}",
  "$('scheme').onchange=()=>{state.scheme=$('scheme').value;$('app').classList.toggle('internal-color',state.scheme==='color')};",
  "$('stats-scheme').onchange=()=>{state.statsScheme=$('stats-scheme').value;$('app').classList.toggle('stats-color',state.statsScheme==='color')};",
  "$('stats').onclick=e=>{const button=e.target.closest('[data-stat]');if(!button)return;const stat=DB.stats[Number(button.dataset.stat)];$('stats-feedback').textContent=`${stat.label}明细示例：${stat.value}项，${stat.detail}。`};",
  "$('width').onclick=()=>{state.narrow=!state.narrow;$('app').classList.toggle('narrow',state.narrow);$('width').setAttribute('aria-pressed',String(state.narrow))};",
  "$('projects').onclick=e=>{const button=e.target.closest('[data-project]');if(!button)return;state.project=Number(button.dataset.project);$('project-name').textContent=DB.projects[state.project].name;renderProjects()};",
  "$('session-query').oninput=renderLists;$('todo-query').oninput=renderLists;",
  "$('todos').onchange=e=>{if(!e.target.matches('[data-todo]'))return;DB.todos[Number(e.target.dataset.todo)].done=e.target.checked;renderLists()};",
  "$('sessions').onclick=e=>{const button=e.target.closest('[data-session]');if(button)$('feedback').textContent='已选中示例会话：'+button.dataset.session};",
  "renderStats();renderProjects();renderLists();",
  "\u003c/script>",
  "",
  "\u003cscript>",
  "document.addEventListener('click',event=>{",
  "  const link=event.target.closest('[data-demo-link]');",
  "  if(!link)return;",
  "  event.preventDefault();",
  "  parent.postMessage({type:'workbase-demo-navigation',id:link.dataset.demoLink},'*');",
  "});",
  "\u003c/script>",
  "\u003c/body>",
  "\u003c/html>",
  ""
]
</script>

  "\u003cdiv class=\"intro\">\u003ch1>从统计直接查看待办\u003c/h1>\u003cp>打开待办详情时隐藏统计弹窗，关闭或保存后恢复原列表，保留分组、搜索与滚动位置。诊断会话标识完整显示，可选中复制。\u003c/p>\u003c/div>",
  "\u003cmain class=\"stage\" id=\"stage\">",
  " \u003csection class=\"overview\" aria-label=\"工作台概览原型\">",
  "  \u003cheader class=\"modal-head\">\u003ch2>工作台概览\u003c/h2>\u003cbutton type=\"button\" class=\"icon-button\" id=\"close-overview\" aria-label=\"关闭概览\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"m18 6-12 12M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/header>",
  "  \u003cdiv class=\"overview-layout\">",
  "   \u003cnav class=\"primary-nav\" aria-label=\"统计分类\">",
  "    \u003cbutton type=\"button\" data-tab=\"todo\" aria-pressed=\"true\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"m9 11 3 3L22 4\"/>\u003cpath d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/>\u003c/svg>待办\u003c/button>",
  "    \u003cbutton type=\"button\" data-tab=\"diagnosis\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"m10.3 3.9-8.2 14.2A2 2 0 0 0 3.8 21h16.4a2 2 0 0 0 1.7-2.9L13.7 3.9a2 2 0 0 0-3.4 0\"/>\u003cpath d=\"M12 9v4m0 4h.01\"/>\u003c/svg>诊断\u003c/button>",
  "   \u003c/nav>",
  "   \u003csection class=\"content\">",
  "    \u003cdiv class=\"page-heading\">\u003ch3 id=\"heading\">项目待办\u003c/h3>\u003c/div>",
  "    \u003cp class=\"description\" id=\"description\">汇总项目中的待处理事项，点击直接查看详情。\u003c/p>",
  "    \u003cdiv class=\"browser\">",
  "     \u003caside class=\"groups\">",
  "      \u003clabel class=\"search-field\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"11\" cy=\"11\" r=\"8\"/>\u003cpath d=\"m21 21-4.3-4.3\"/>\u003c/svg>\u003cinput id=\"query\" type=\"search\" aria-label=\"搜索分组或记录\" placeholder=\"搜索项目\">\u003c/label>",
  "      \u003cnav id=\"groups\" aria-label=\"记录分组\">\u003c/nav>",
  "     \u003c/aside>",
  "     \u003cdiv class=\"results\" id=\"results\" tabindex=\"0\" role=\"region\" aria-label=\"统计记录\">\u003c/div>",
  "    \u003c/div>",
  "   \u003c/section>",
  "  \u003c/div>",
  "  \u003cfooter class=\"modal-foot\">\u003cbutton type=\"button\" id=\"reopen\">重新打开概览\u003c/button>\u003cbutton type=\"button\" id=\"close-foot\">关闭\u003c/button>\u003c/footer>",
  " \u003c/section>",
  "\u003c/main>",
  "\u003cdialog class=\"detail\" id=\"detail\" aria-labelledby=\"detail-heading\">",
  " \u003cheader class=\"modal-head\">\u003ch2 id=\"detail-heading\">待办详情\u003c/h2>\u003cbutton type=\"button\" class=\"icon-button\" id=\"close-detail\" aria-label=\"关闭待办详情\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"m18 6-12 12M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/header>",
  " \u003cdiv class=\"meta\">\u003cspan>待处理\u003c/span>\u003cspan id=\"project-name\">\u003c/span>\u003cspan>创建于 2026-11-11\u003c/span>\u003c/div>",
  " \u003cform id=\"todo-form\" class=\"detail-body\">",
  "  \u003cdiv class=\"title-row\">\u003cinput id=\"todo-title\" aria-label=\"待办标题\" required>\u003cselect id=\"priority\" aria-label=\"待办优先级\">\u003coption value=\"\">未设置\u003c/option>\u003coption value=\"high\">高\u003c/option>\u003coption value=\"medium\">中\u003c/option>\u003coption value=\"low\">低\u003c/option>\u003c/select>\u003c/div>",
  "  \u003cdiv class=\"label-row\">\u003clabel for=\"note\">描述\u003c/label>\u003c/div>\u003ctextarea id=\"note\" aria-label=\"待办描述\">\u003c/textarea>",
  "  \u003cdiv class=\"label-row\">\u003cspan>附件\u003c/span>\u003csmall>1 个\u003c/small>\u003c/div>",
  "  \u003cdiv class=\"attachment\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z\"/>\u003cpath d=\"M14 2v6h6M8 13h8m-8 4h6\"/>\u003c/svg>\u003cdiv>接口说明.md\u003csmall>2.4 KB\u003c/small>\u003c/div>\u003c/div>",
  " \u003c/form>",
  " \u003cfooter class=\"modal-foot\">\u003cspan class=\"hint\">关闭后返回原统计列表\u003c/span>\u003cdiv>\u003cbutton type=\"button\" id=\"start-session\">发起会话\u003c/button> \u003cbutton type=\"submit\" form=\"todo-form\" class=\"primary\" id=\"save\">保存\u003c/button>\u003c/div>\u003c/footer>",
  "\u003c/dialog>",
  "\u003cp class=\"status\" id=\"feedback\" role=\"status\" aria-live=\"polite\">\u003c/p>",
  "\u003cscript>",
  "const titles=['完善待办附件下载','统一设置页控件样式','优化项目目录选择','修正会话标题缓存','补充备份恢复说明','整理统计明细布局','处理附件上传失败','优化会话输入草稿'];",
  "const DB={",
  " todos:titles.map((title,i)=>({id:'todo-'+i,title,project:i%2?'工作台插件':'默认工作区',priority:i%3===0?'high':'',note:'完成当前待办的实现与交付。\\n\\n验收要求：\\n1. 保留现有数据与交互。\\n2. 确认修改范围。\\n3. 验证完成后更新待办状态。'})),",
  " issues:Array.from({length:7},(_,i)=>({id:'session-019a6f3d-42b7-7c01-8a35-'+String(482916370125+i),project:i\u003c3?'默认工作区':i\u003c5?'未分组会话':'工作台插件',kind:'空会话'}))",
  "};",
  "const state={tab:'todo',group:'',query:'',selected:null,origin:null};",
  "const byId=id=>document.getElementById(id);",
  "const escapeHtml=value=>String(value).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));",
  "// Prototype-only service; replace with owner RPC update-todo {id,title,note,priority,expectedVersion}.",
  "const api={async saveTodo(todo,patch){Object.assign(todo,patch);return todo;}};",
  "function notify(text){byId('feedback').textContent=text;}",
  "function render(){",
  " const diagnostic=state.tab==='diagnosis',items=diagnostic?DB.issues:DB.todos;",
  " byId('heading').textContent=diagnostic?'项目诊断':'项目待办';",
  " byId('description').textContent=diagnostic?'完整显示会话标识，目录路径仅保留在正式诊断的全文提示中。':'汇总项目中的待处理事项，点击直接查看详情。';",
  " document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===state.tab)));",
  " byId('query').placeholder=diagnostic?'搜索异常':'搜索项目';",
  " const filtered=items.filter(item=>[item.project,item.title||item.kind,item.id].join(' ').toLocaleLowerCase().includes(state.query.toLocaleLowerCase()));",
  " const groups=diagnostic?['空会话']:Array.from(new Set(items.map(item=>item.project)));",
  " byId('groups').innerHTML=['',...groups].map(group=>{",
  "  const count=filtered.filter(item=>!group||(diagnostic?item.kind:item.project)===group).length;",
  "  return '\u003cbutton type=\"button\" class=\"group\" data-group=\"'+escapeHtml(group)+'\" aria-pressed=\"'+(state.group===group)+'\">\u003cspan>'+escapeHtml(group||(diagnostic?'全部异常':'全部项目'))+'\u003c/span>\u003cspan>'+count+'\u003c/span>\u003c/button>';",
  " }).join('');",
  " const visible=filtered.filter(item=>!state.group||(diagnostic?item.kind:item.project)===state.group);",
  " byId('results').innerHTML=(diagnostic?'\u003cdiv class=\"list-heading\">\u003cstrong>'+escapeHtml(state.group||'全部异常')+' · '+visible.length+'\u003c/strong>\u003cbutton type=\"button\" data-delete-all>删除全部空会话（'+DB.issues.length+'）\u003c/button>\u003c/div>':'')+",
  " visible.map(item=>diagnostic?'\u003carticle class=\"record\">\u003cdiv class=\"record-copy\">\u003cstrong>'+escapeHtml(item.project)+' · 空会话\u003c/strong>\u003csmall>尚未开始对话\u003c/small>\u003cdiv class=\"diagnosis-id\">'+escapeHtml(item.id)+'\u003c/div>\u003c/div>\u003cbutton type=\"button\" data-delete=\"'+escapeHtml(item.id)+'\">删除空会话\u003c/button>\u003c/article>':",
  " '\u003cbutton type=\"button\" class=\"record\" data-todo=\"'+item.id+'\">\u003cspan class=\"record-copy\">\u003cstrong>'+escapeHtml(item.title)+'\u003c/strong>\u003csmall>2026-11-11 20:30\u003c/small>\u003c/span>\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"m9 18 6-6-6-6\"/>\u003c/svg>\u003c/button>').join('')+",
  " (!visible.length?'\u003cp class=\"empty\">'+(state.query?'没有匹配的记录':'暂无记录')+'\u003c/p>':'');",
  "}",
  "function openTodo(id){",
  " const todo=DB.todos.find(todo=>todo.id===id);if(!todo)return;",
  " state.selected=todo;state.origin={scroll:byId('results').scrollTop,todoId:id};",
  " byId('todo-title').value=todo.title;byId('priority').value=todo.priority;byId('note').value=todo.note;byId('project-name').textContent=todo.project;",
  " byId('detail').showModal();",
  " document.querySelector('.overview').classList.add('suspended');",
  " document.querySelector('.overview').setAttribute('aria-hidden','true');",
  "}",
  "function closeTodo(){byId('detail').close();}",
  "byId('detail').addEventListener('close',()=>{",
  " document.querySelector('.overview').classList.remove('suspended');",
  " document.querySelector('.overview').removeAttribute('aria-hidden');",
  " const origin=state.origin;state.selected=null;render();",
  " if(origin){byId('results').scrollTop=origin.scroll;const button=byId('results').querySelector('[data-todo=\"'+origin.todoId+'\"]');button?.focus({preventScroll:true});}",
  " state.origin=null;",
  " notify('统计弹窗已恢复，返回原列表，分组、搜索和滚动位置保留。');",
  "});",
  "byId('close-detail').onclick=closeTodo;",
  "byId('todo-form').onsubmit=async event=>{",
  " event.preventDefault();const title=byId('todo-title').value.trim();",
  " if(!title){byId('todo-title').setCustomValidity('请填写待办标题');byId('todo-title').reportValidity();return;}",
  " const todo=state.selected;if(!todo)return;",
  " byId('save').disabled=true;",
  " try{await api.saveTodo(todo,{title,note:byId('note').value,priority:byId('priority').value});closeTodo();notify('已保存待办，并返回原统计列表。');}",
  " finally{byId('save').disabled=false;}",
  "};",
  "byId('todo-title').oninput=()=>byId('todo-title').setCustomValidity('');",
  "byId('start-session').onclick=()=>notify('原型演示：根据此待办准备会话草稿，由用户发送。');",
  "document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.group='';state.query='';byId('query').value='';render();byId('results').scrollTop=0;});",
  "byId('groups').onclick=event=>{const button=event.target.closest('[data-group]');if(!button)return;state.group=button.dataset.group;render();byId('results').scrollTop=0;};",
  "byId('query').oninput=event=>{state.query=event.target.value;state.group='';render();byId('results').scrollTop=0;};",
  "byId('results').onclick=event=>{",
  " const todo=event.target.closest('[data-todo]');if(todo){openTodo(todo.dataset.todo);return;}",
  " const remove=event.target.closest('[data-delete],[data-delete-all]');",
  " if(remove)notify('原型只展示删除入口，不执行删除。正式功能仍需确认并逐项复查。');",
  "};",
  "byId('width').onchange=event=>byId('stage').classList.toggle('compact',event.target.value==='compact');",
  "byId('theme').onclick=()=>{document.body.classList.toggle('light');byId('theme').textContent=document.body.classList.contains('light')?'切换深色':'切换浅色';};",
  "const closeOverview=()=>{document.querySelector('.overview-layout').hidden=true;notify('概览已收起，点击“重新打开概览”继续。');};",
  "byId('close-overview').onclick=closeOverview;byId('close-foot').onclick=closeOverview;",
  "byId('reopen').onclick=()=>{document.querySelector('.overview-layout').hidden=false;notify('概览已重新打开。');};",
  "document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!byId('detail').open)closeOverview();});",
  "render();",
  "\u003c/script>",
  "",
  "\u003cscript>",
  "document.addEventListener('click',event=>{",
  "  const link=event.target.closest('[data-demo-link]');",
  "  if(!link)return;",
  "  event.preventDefault();",
  "  parent.postMessage({type:'workbase-demo-navigation',id:link.dataset.demoLink},'*');",
  "});",
  "\u003c/script>",
  "\u003c/body>",
  "\u003c/html>",
  ""
]
</script>

  ".setting-row{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:64px;padding:14px 0;border-bottom:1px solid var(--line)}.setting-row strong{font-weight:500}.setting-row small{margin-top:4px}.setting-row>div{min-width:0}.switch{appearance:none;position:relative;flex:none;width:32px;height:18px;padding:0;margin:0;border:0;border-radius:20px;background:var(--muted);cursor:pointer}.switch:before{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0002;transition:transform .15s}.switch:checked{background:var(--accent)}.switch:checked:before{transform:translateX(14px)}.dependent{padding-left:16px;border-left:2px solid var(--line);margin:12px 0 20px}.dependent .setting-row{border-bottom:0}.select-control{width:180px;height:40px;flex:none;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);padding:9px 12px}.note{font-size:12px;line-height:20px;color:var(--muted);margin-top:12px}.mode-note{display:flex;gap:12px;padding:14px 16px;background:var(--bg);border:1px solid var(--line);border-radius:7px}.mode-note svg{margin-top:2px;color:var(--muted)}.mode-note strong{font-size:12px;font-weight:500}.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.theme-card{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}.theme-card:hover{background:var(--hover)}.theme-card:has(input:checked){background:var(--soft);border-color:var(--accent)}.theme-card input{flex:none;width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent)}.theme-card strong{font-size:14px;font-weight:500}.theme-card small{margin-top:6px}",

  "@container workbase (max-width:650px){.overlay{padding-top:24px}.drawer{width:100%;height:calc(100dvh - 124px)}.dialog-head{height:60px;padding:0 18px}.settings-layout{flex-direction:column}.nav{width:100%;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:4px}.nav button{flex:1 1 28%;justify-content:center;padding:8px 4px;gap:4px}.content{padding:20px 18px}.subtabs{gap:20px}.themes{grid-template-columns:1fr}.select-control{width:140px}.dialog-footer{min-height:64px;padding:14px 18px;padding-bottom:max(14px,env(safe-area-inset-bottom))}.save-note{display:none}.dialog-footer button:first-of-type{margin-left:auto}}@container workbase (max-width:480px){.setting-row:has(.select-control){flex-direction:column;align-items:stretch;gap:12px}.select-control{width:100%}.nav svg{display:none}}@media(prefers-reduced-motion:reduce){.drawer{animation:none}button,.switch:before{transition:none}}",
  "\u003c/style>\u003c/head>\u003cbody>",
  "\u003cheader class='review-bar'>\u003cdiv class='review-copy'>\u003cstrong>外观布局 · 二级菜单顺序\u003c/strong>\u003cp>首页模块 → 统计卡片 → 主题配色；默认页在首位，首页相关设置相邻。\u003c/p>\u003c/div>\u003cdiv class='review-controls'>\u003clabel for='panel-width'>面板\u003cselect id='panel-width'>\u003coption value='wide'>常规\u003c/option>\u003coption value='compact'>窄面板\u003c/option>\u003c/select>\u003c/label>\u003clabel for='host-mode'>宿主外观（模拟）\u003cselect id='host-mode'>\u003coption value='light'>浅色\u003c/option>\u003coption value='dark'>深色\u003c/option>\u003c/select>\u003c/label>\u003cbutton id='reopen' type='button'>打开设置\u003c/button>\u003c/div>\u003c/header>",

  "\u003cdiv class='settings-layout'>\u003cnav class='nav' aria-label='设置分类'>\u003cbutton disabled title='本次仅演示外观布局，其他设置沿用现有页面'>\u003csvg viewBox='0 0 24 24'>\u003cpath d='M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z'/>\u003c/svg>通用配置\u003c/button>\u003cbutton type='button' aria-current='page' id='appearance-nav'>\u003csvg viewBox='0 0 24 24'>\u003cpath d='M12 3a9 9 0 1 0 0 18h1.5a2.5 2.5 0 0 0 1.8-4.3 1 1 0 0 1 .7-1.7h1a4 4 0 0 0 4-4 8 8 0 0 0-9-8'/>\u003ccircle cx='7.5' cy='10' r='.5'/>\u003ccircle cx='10' cy='6.5' r='.5'/>\u003ccircle cx='15' cy='6.5' r='.5'/>\u003ccircle cx='17.5' cy='10' r='.5'/>\u003c/svg>外观布局\u003c/button>\u003cbutton disabled title='沿用现有项目配置'>\u003csvg viewBox='0 0 24 24'>\u003cpath d='M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v2M3 7h17l-3 13H3z'/>\u003c/svg>项目配置\u003c/button>\u003cbutton disabled title='沿用现有备份恢复'>\u003csvg viewBox='0 0 24 24'>\u003cpath d='M3 3h18v4H3zM5 7v14h14V7M10 11h4'/>\u003c/svg>备份恢复\u003c/button>\u003cbutton disabled title='沿用现有其他组件'>\u003csvg viewBox='0 0 24 24'>\u003cpath d='M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z'/>\u003c/svg>其他组件\u003c/button>\u003c/nav>",
  "\u003cdiv id='content' class='content'>\u003ch2>外观布局\u003c/h2>\u003cp class='description'>选择工作台主题，调整首页模块与统计卡片。\u003c/p>\u003cdiv class='subtabs' role='tablist' aria-label='外观布局分类'>\u003cbutton id='tab-layout' type='button' role='tab' data-tab='layout' aria-controls='panel-layout'>首页模块\u003c/button>\u003cbutton id='tab-stats' type='button' role='tab' data-tab='stats' aria-controls='panel-stats'>统计卡片\u003c/button>\u003cbutton id='tab-theme' type='button' role='tab' data-tab='theme' aria-controls='panel-theme'>主题配色\u003c/button>\u003c/div>",
  "\u003csection id='panel-theme' role='tabpanel' aria-labelledby='tab-theme' hidden>\u003cdiv class='mode-note'>\u003csvg viewBox='0 0 24 24'>\u003ccircle cx='12' cy='12' r='10'/>\u003cpath d='M12 16v-4M12 8h.01'/>\u003c/svg>\u003cdiv>\u003cstrong id='mode-copy'>当前外观：浅色\u003c/strong>\u003csmall>切换明暗模式，请前往 DSH 设置 → 外观。\u003c/small>\u003c/div>\u003c/div>\u003cdiv id='themes' class='themes' role='radiogroup' aria-label='工作台主题'>\u003c/div>\u003cp class='note'>选择后即时预览；保存保留，取消恢复。\u003c/p>\u003c/section>",
  "\u003csection id='panel-layout' role='tabpanel' aria-labelledby='tab-layout'>\u003cdiv id='home-rows'>\u003c/div>\u003cp class='note'>隐藏模块后仍可使用顶部搜索与设置。\u003c/p>\u003c/section>",
  "\u003csection id='panel-stats' role='tabpanel' aria-labelledby='tab-stats' hidden>\u003cdiv id='stat-rows'>\u003c/div>\u003cp id='stats-note' class='note' role='status'>\u003c/p>\u003clabel class='setting-row' for='stat-days'>\u003cdiv>\u003cstrong>时间范围\u003c/strong>\u003csmall>同时影响会话统计卡与项目「近期活跃」数量。\u003c/small>\u003c/div>\u003cselect id='stat-days' class='select-control'>\u003coption value='7'>最近 7 天\u003c/option>\u003coption value='14'>最近 14 天\u003c/option>\u003coption value='30'>最近 30 天\u003c/option>\u003c/select>\u003c/label>\u003c/section>\u003c/div>\u003c/div>",
  "\u003cfooter class='dialog-footer'>\u003cspan id='save-note' class='save-note'>统一保存 · 主题即时预览\u003c/span>\u003cbutton id='cancel' type='button'>取消\u003c/button>\u003cbutton id='save' class='primary' type='button'>保存设置\u003c/button>\u003c/footer>\u003c/section>\u003c/div>\u003cdiv id='closed' class='closed' hidden>\u003cp>设置已关闭。\u003c/p>\u003cbutton id='open-again' type='button'>重新打开设置\u003c/button>\u003c/div>\u003c/main>\u003cdiv id='toast' class='toast' role='status' hidden>\u003c/div>",
  "\u003cscript>",
  "// 仅模拟现有偏好字段；原型存储与正式工作台完全独立。",
  "const DB={themes:[['follow','跟随 DSH 主题','同步 DSH 当前配置的主题及后续变更。'],['dsh','DSH 默认主题','固定使用 DSH 官方默认配色。'],['fresh','清爽主题','冷白与森林绿，清晰紧凑的工具风格。'],['warm','温暖阅读','纸色与棕色，柔和的阅读式字体。'],['violet','紫晶工作台','白底、冷灰与紫色强调，深色采用柔和紫晶色。']],homeRows:[['quick','快捷会话','输入任务并选择项目，直接开始新会话。'],['stats','数据统计','展示统计卡，并开启「统计卡片」页签。'],['recent','最近会话','显示输入框下方的最近会话入口。'],['projects','项目总览','显示项目列表 / 宫格与筛选、视图切换按钮。']],statRows:[['running','运行统计','尚未结束的会话。'],['recent','会话统计','所选时间范围内更新的未归档会话。'],['pending','待办统计','跨项目的未完成待办。'],['diagnostic','项目诊断','项目目录可用性检查。']]};",
  "const defaults={theme:'follow',home:{quick:true,recent:false,stats:true,projects:true,recentStyle:'cards',statCards:{running:true,recent:true,pending:true,diagnostic:true},statDays:7}};",
  "const clone=value=>JSON.parse(JSON.stringify(value));const byId=id=>document.getElementById(id);const storageKey='dsh-prototype-appearance-layout-v1';let saved=clone(defaults);",
  "try{const candidate=JSON.parse(localStorage.getItem(storageKey));if(candidate&&DB.themes.some(t=>t[0]===candidate.theme)&&candidate.home&&DB.homeRows.every(r=>typeof candidate.home[r[0]]==='boolean')&&['cards','buttons'].includes(candidate.home.recentStyle)&&[7,14,30].includes(candidate.home.statDays)&&candidate.home.statCards&&DB.statRows.every(r=>typeof candidate.home.statCards[r[0]]==='boolean'))saved=clone(candidate)}catch{}",
  "const state={draft:clone(saved),tab:'layout',busy:false,open:true};let toastTimer;",
  "// 正式实现继续使用现有 settings 命令；此服务只模拟成功或本地存储失败。",
  "const api={async savePreferences(value){await new Promise(resolve=>setTimeout(resolve,240));localStorage.setItem(storageKey,JSON.stringify(value));return clone(value)}};",
  "function notify(message){clearTimeout(toastTimer);byId('toast').textContent=message;byId('toast').hidden=false;toastTimer=setTimeout(()=>{byId('toast').hidden=true},3200)}",
  "function palette(){byId('stage').dataset.palette=state.draft.theme==='follow'?'dsh':state.draft.theme;byId('stage').classList.toggle('dark',byId('host-mode').value==='dark');byId('mode-copy').textContent='当前外观：'+(byId('host-mode').value==='dark'?'深色':'浅色')}",
  "function switchTab(tab){if(tab==='stats'&&!state.draft.home.stats)return;state.tab=tab;renderTabs();byId('content').scrollTop=0}",
  "function renderTabs(){document.querySelectorAll('[data-tab]').forEach(button=>{const id=button.dataset.tab;button.hidden=id==='stats'&&!state.draft.home.stats;button.setAttribute('aria-selected',String(id===state.tab));button.tabIndex=id===state.tab?0:-1;byId('panel-'+id).hidden=id!==state.tab})}",
  "function row(prefix,key,label,hint,checked){return `<label class='setting-row' for='${prefix}-${key}'><div><strong>显示${label}</strong><small>${hint}</small></div><input id='${prefix}-${key}' class='switch' type='checkbox' data-${prefix}='${key}' ${checked?'checked':''}></label>`}",
  "function render(){const h=state.draft.home;palette();if(!h.stats&&state.tab==='stats')state.tab='layout';renderTabs();",
  "byId('themes').innerHTML=DB.themes.map(([id,label,description])=>`<label class='theme-card' for='theme-${id}'><input id='theme-${id}' type='radio' name='theme' value='${id}' ${state.draft.theme===id?'checked':''} aria-describedby='theme-description-${id}'><span><strong>${label}</strong><small id='theme-description-${id}'>${description}</small></span></label>`).join('');",
  "byId('home-rows').innerHTML=DB.homeRows.map(([key,label,hint])=>row('home',key,label,hint,h[key])+(key==='recent'&&h.recent?`<div class='dependent'><label class='setting-row' for='recent-style'><div><strong>最近会话样式</strong><small>${h.stats?'统计区域开启时使用按钮样式。':'关闭统计区域后，恢复你选择的展示样式。'}</small></div><select id='recent-style' class='select-control' ${h.stats?'disabled':''}><option value='cards'>卡片</option><option value='buttons'>按钮</option></select></label>${h.stats?`<p class='note'>关闭数据统计后恢复所选样式；当前偏好：${h.recentStyle==='cards'?'卡片':'按钮'}。</p>`:''}</div>`:'')).join('');",
  "if(byId('recent-style'))byId('recent-style').value=h.stats?'buttons':h.recentStyle;",
  "byId('stat-rows').innerHTML=DB.statRows.map(([key,label,hint])=>row('stat',key,label,hint,h.statCards[key])).join('');byId('stat-days').value=String(h.statDays);",
  "byId('stats-note').textContent=Object.values(h.statCards).some(Boolean)?'统计卡可单独隐藏，点击后查看概览对应分类。':'全部关闭时，首页统计区域不显示。';",
  "byId('save-note').textContent=JSON.stringify(state.draft)===JSON.stringify(saved)?'统一保存 · 主题即时预览':'有未保存修改 · 主题即时预览';",
  "document.querySelectorAll('.drawer button,.drawer input,.drawer select').forEach(control=>{if(control.closest('.nav'))return;control.disabled=state.busy||(control.id==='recent-style'&&h.stats)});byId('save').textContent=state.busy?'保存中…':'保存设置'}",
  "document.querySelector('.subtabs').addEventListener('click',event=>{const button=event.target.closest('[data-tab]');if(button&&!state.busy)switchTab(button.dataset.tab)});",
  "document.querySelector('.subtabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)||state.busy)return;event.preventDefault();const tabs=[...document.querySelectorAll('[data-tab]')].filter(b=>!b.hidden);const index=tabs.findIndex(b=>b.dataset.tab===state.tab);const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;switchTab(tabs[next].dataset.tab);tabs[next].focus()});",
  "byId('content').addEventListener('change',event=>{if(state.busy)return;const input=event.target;const focusId=input.id;if(input.name==='theme'){state.draft.theme=input.value}else if(input.dataset.home){state.draft.home[input.dataset.home]=input.checked}else if(input.dataset.stat){state.draft.home.statCards[input.dataset.stat]=input.checked}else if(input.id==='recent-style'){state.draft.home.recentStyle=input.value}else if(input.id==='stat-days'){state.draft.home.statDays=Number(input.value)}else return;render();byId(focusId)?.focus({preventScroll:true})});",
  "function closeSettings(){if(state.busy)return;state.draft=clone(saved);state.open=false;render();byId('overlay').hidden=true;byId('closed').hidden=false;byId('reopen').focus()}",
  "function openSettings(){if(state.busy)return;if(state.open){byId('tab-'+state.tab).focus();return}state.draft=clone(saved);state.open=true;state.tab='layout';byId('overlay').hidden=false;byId('closed').hidden=true;render();byId('content').scrollTop=0;byId('tab-layout').focus()}",
  "byId('close').onclick=closeSettings;byId('cancel').onclick=closeSettings;byId('reopen').onclick=openSettings;byId('open-again').onclick=openSettings;byId('appearance-nav').onclick=()=>switchTab('layout');",
  "byId('save').onclick=async()=>{if(state.busy)return;state.busy=true;render();try{saved=await api.savePreferences(state.draft);state.busy=false;closeSettings();notify('原型设置已保存')}catch{state.busy=false;render();notify('原型设置保存失败，修改已保留，请重试')}};",
  "byId('host-mode').onchange=palette;byId('panel-width').onchange=event=>byId('stage').classList.toggle('compact',event.target.value==='compact');",
  "document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.open)closeSettings()});render();",
  "\u003c/script>\u003c/body>\u003c/html>"
]
</script>
<script>
// 这里只装载内嵌演示，不调用宿主接口；主原型仍是唯一构建基线。
(()=>{
  const modal=document.getElementById('demo-library-modal');
  const select=document.getElementById('demo-library-select');
  const frame=document.getElementById('demo-library-frame');
  const trigger=document.getElementById('preview-demo-gallery');
  const target=document.getElementById('preview-demo-target');
  const cache=new Map();
  const frames=new Map();
  let active=frame;
  let originHash='';
  let originFocus=null;
  let returningToMain=false;
  const source=id=>document.getElementById('demo-source-'+id);
  function show(id,updateHash=true){
    if(['todo','stats-flow','skills','mcp','rss'].includes(id)){
      if(modal.open){returningToMain=true;modal.close()}
      closeModal(true);
      if(id==='todo'){
        const project=projects.find(p=>!p.removed&&!p.merged&&!p.archived);
        if(!project)return toast('暂无可用项目，请先添加项目');
        go('detail',project.id);
        openTodoEditor(project.todos.find(t=>t.status!==2)||project.todos[0]);
      }else openStats(id==='stats-flow'?'pending':id);
      target.value=id;
      if(updateHash)history.replaceState(null,'','#demo='+id);
      return;
    }
    const data=source(id);
    if(!data)return;
    if(!modal.open){
      originHash=location.hash.startsWith('#demo=')?'':location.hash;
      originFocus=document.activeElement;
      modal.showModal();
    }
    select.value=id;
    if(!cache.has(id))cache.set(id,JSON.parse(data.textContent).join('\n'));
    // 保留已打开演示的内存状态和模拟后台任务，切换不重复执行脚本。
    active.hidden=true;
    if(!frames.has(id)){
      const next=frame.cloneNode();
      next.id='demo-frame-'+id;
      next.title=data.dataset.demoLabel;
      next.srcdoc=cache.get(id);
      modal.append(next);
      frames.set(id,next);
    }
    active=frames.get(id);
    active.hidden=false;
    if(updateHash)history.replaceState(null,'','#demo='+id);
  }
  trigger.addEventListener('click',()=>show(target.value));
  select.addEventListener('change',()=>show(select.value));
  document.getElementById('demo-library-close').addEventListener('click',()=>modal.close());
  modal.addEventListener('close',()=>{
    if(returningToMain){returningToMain=false;return}
    history.replaceState(null,'',location.pathname+location.search+originHash);
    if(originFocus&&originFocus.isConnected)originFocus.focus();else trigger.focus();
  });
  window.addEventListener('message',event=>{
    if(event.source!==active.contentWindow||event.data?.type!=='workbase-demo-navigation')return;
    if(typeof event.data.id==='string'&&source(event.data.id))show(event.data.id);
  });
  function openHash(){
    const match=location.hash.match(/^#demo=([a-z-]+)$/);
    if(match&&(source(match[1])||['todo','stats-flow','skills','mcp','rss'].includes(match[1])))show(match[1],false);
    else if(modal.open)modal.close();
  }
  window.addEventListener('hashchange',openHash);
  document.addEventListener('DOMContentLoaded',openHash,{once:true});
})();
</script>

<script>
// 独立演示是HTML兄弟节点；管理页渲染在此完成，不能把演示嵌入脚本字符串。
function integrationFinishDetail(d,detail,title,body,footer,editing,item,back,save){
 if(d.kind==='rss-settings'){
  title='订阅刷新设置';body=`<form id="integration-edit-form"><div class="integration-form-grid">${integrationSelect('自动刷新','i-interval',[['0','仅手动刷新'],['15','每 15 分钟'],['30','每 30 分钟'],['60','每小时']],integrationDB.refreshInterval)}</div><p class="integration-help">原型只保存此选项，不创建实际定时任务；正式功能只刷新已启用的来源。</p></form>`;footer=back+save;
 }else if(d.kind.endsWith('-export')){

function bindStatsGroups(dialog){

 }
