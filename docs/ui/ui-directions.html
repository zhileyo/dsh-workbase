.app .preview-message{display:flex;flex-direction:column;gap:4px}
.app .preview-role{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.app .preview-role>span{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:color-mix(in srgb,var(--text) 6%,var(--surface));font-size:11px}
.app .preview-message[data-role=user] .preview-role>span{color:var(--accent)}
.app .preview-text{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.8;margin:0;overflow-wrap:anywhere;user-select:text}
.app .preview-earlier{margin:0}
/* 路径前缀四圆点图标：inline-flex 与路径文字垂直居中；细描边圆点与官方图标绘制惯例一致。 */
.app .directory-name{display:inline-flex;align-items:center;gap:4px}
.app .directory-name svg{width:8px;height:8px;flex:none}
.app .theme-select-value{display:inline-flex;align-items:center;gap:4px}
.app .theme-select-value svg{width:8px;height:8px;flex:none}
/* 详情页行首 folder 图标：容器以内联 flex 居中，避免 svg 溢出导致的错位。 */
.app .detail-folder-icon{display:inline-flex;align-items:center;justify-content:center}
.app .stats-item-copy small svg{width:10px;height:10px;margin:0 4px;vertical-align:-1px}
.app .composer-picked svg,.app .composer-option-copy>span>svg{width:11px;height:11px;margin-right:4px;vertical-align:-1.5px}
/* 加载骨架：模拟首页布局的占位块，读取完成后替换。 */
.app .wb-skeleton{flex:1;min-height:0;padding:26px 32px;display:flex;flex-direction:column;gap:22px;overflow:hidden}
.app .wb-skeleton i{display:block;border-radius:12px;background:color-mix(in srgb,var(--text) 7%,var(--surface));animation:wb-pulse 1.6s ease-in-out infinite}
.app .wb-skeleton .s-composer{height:118px;border-radius:20px}
.app .wb-skeleton .s-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.app .wb-skeleton .s-row i{height:92px}
.app .wb-skeleton .s-projects{grid-template-columns:repeat(3,1fr)}
.app .wb-skeleton .s-projects i{height:150px}
/* 输入框 shell：外层主题色渐变卡（含下方分支条），内层白色输入卡，配色全部来自主题令牌。 */
.app .home-composer.composer-shell,.app .home-main .home-composer.composer-shell{border-radius:20px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),color-mix(in srgb,var(--accent) 5%,var(--surface)));border:1px solid color-mix(in srgb,var(--accent) 26%,var(--line));box-shadow:none}
.app .composer-shell .composer-body{background:var(--surface);border-radius:16px;padding:8px 10px 4px;display:flex;flex-direction:column}
.app .composer-shell .composer-actions{display:flex!important;justify-content:space-between!important;padding-top:2px}
.app .composer-shell .composer-leading{display:flex!important;flex:1 1 auto!important;justify-content:flex-start!important;align-items:center!important;gap:4px!important;min-width:0}
.app .composer-shell .composer-trailing{display:flex!important;flex:0 0 auto!important;align-items:center!important}
.app .composer-leading>.wb-icon{width:32px!important;height:32px!important;border:0!important;background:var(--hover)!important;color:var(--muted)!important;border-radius:50%!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:none}
.app .composer-leading>.wb-icon:hover{color:var(--text)!important}
.app .composer-leading>.wb-icon svg{width:16px!important;height:16px!important}
/* 分支条：右对齐，未勾选显示当前分支，勾选后切换基准分支选择器。 */
.app .composer-branchbar{display:flex;align-items:center;justify-content:flex-end;gap:20px;min-height:40px;padding:0 18px 6px}
.app .branch-static{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.app .branch-static svg{flex:none}
.app .composer-branchbar .theme-select-trigger{height:30px;background:var(--hover);border-radius:8px}
.app .composer-branchbar .theme-select-value{gap:5px}
.app .composer-branchbar .theme-select-value svg{width:10px;height:10px}
.app .worktree-toggle{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:0;border-radius:8px;background:var(--hover);color:var(--text);font-size:12.5px;cursor:pointer}
.app .worktree-toggle:hover{filter:brightness(.97)}
.app .worktree-toggle[aria-checked=true]{background:color-mix(in srgb,var(--accent) 16%,var(--hover))}
.app .wt-box{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:3px;border:1.5px solid var(--muted);background:transparent;color:var(--surface)}
.app .worktree-toggle[aria-checked=true] .wt-box{background:var(--text);border-color:var(--text)}
</style>
