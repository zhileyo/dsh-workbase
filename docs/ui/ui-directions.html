   body=`<div class="integration-detail-identity"><span class="integration-record-icon">${icon('plug')}</span><div><h3>${esc(item.name)}</h3><p class="integration-help">${esc(integrationScopeName(item.scope))}</p></div></div>`+summary([integrationState(state,ready?'ok':item.issue?'error':''),esc(item.transport==='stdio'?'stdio':'HTTP'),esc({none:'无认证',bearer:'Bearer Token',oauth:'OAuth','api-key':'API Key'}[item.auth]),item.injection==='session'?'按会话启用':'始终注入'])+`<h3>连接配置</h3><pre class="integration-code-view">${esc(item.transport==='stdio'?item.command+' '+item.args:item.url)}</pre>${item.issue?`<p class="integration-form-error" role="status">${esc(item.issue)}</p>`:''}${item.hasSecret?'<p class="integration-help">已配置凭据，编辑时留空可保留。</p>':''}<details class="integration-tools" data-i-tools ${d.toolsOpen?'open':''}><summary>${icon('chevron')}工具详情<small>${ready?`${item.tools.filter(t=>t.enabled).length} / ${item.tools.length} 个已启用`:!item.enabled?'连接已停用':item.state==='auth'?'授权后查看':'连接后查看'}</small></summary>${item.tools.length?`<label class="integration-tools-search">${icon('search')}<input type="search" data-i-tool-query aria-label="搜索工具名称或说明" placeholder="搜索工具名称或说明" value="${esc(d.toolQuery||'')}"></label><div data-i-tool-results>${integrationToolRows(item,d.toolQuery||'')}</div>`:`<p class="integration-help">${item.state==='auth'?'授权完成后将显示工具列表。':'连接成功后将显示发现的工具。'}</p>`}${!ready&&item.tools.length?'<p class="integration-help">以下为之前发现的工具，当前连接不可用，暂时无法调整开关。</p>':''}</details>`;

  "@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}",

  "\u003c/style>",
  "  ",
  "  ",
  "  ",
  "\u003c/head>",
  "\u003cbody>",
  "  \u003csvg class=\"symbols\" aria-hidden=\"true\" xmlns=\"http://www.w3.org/2000/svg\">",
  "    \u003csymbol id=\"i-puzzle\" viewBox=\"0 0 24 24\">\u003cpath d=\"M19.4 15a2 2 0 1 0 0-4H21V5a2 2 0 0 0-2-2h-6v1.6a2 2 0 1 1-4 0V3H5a2 2 0 0 0-2 2v4h1.6a2 2 0 1 1 0 4H3v6a2 2 0 0 0 2 2h4v-1.6a2 2 0 1 1 4 0V21h6a2 2 0 0 0 2-2v-4Z\"/>\u003c/symbol>",

  "    \u003csymbol id=\"i-refresh\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 12a9 9 0 0 1 15.4-6.4L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.4 6.4L3 16M8 16H3v5\"/>\u003c/symbol>",
  "    \u003csymbol id=\"i-alert\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"M12 8v4M12 16h.01\"/>\u003c/symbol>",
  "    \u003csymbol id=\"i-sun\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"4\"/>\u003cpath d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/>\u003c/symbol>",
  "    \u003csymbol id=\"i-moon\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z\"/>\u003c/symbol>",
  "    \u003csymbol id=\"i-download\" viewBox=\"0 0 24 24\">\u003cpath d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3\"/>\u003c/symbol>",
  "  \u003c/svg>",
  "  \u003cheader class=\"preview-toolbar\">",
  "    \u003cdiv>\u003cstrong>插件更新\u003c/strong>\u003cspan>布局预览 · 版本与操作均为模拟\u003c/span>\u003c/div>",
  "    \u003cdiv class=\"preview-controls\">",
  "      \u003clabel>场景",
  "        \u003cselect id=\"scenario\">",
  "          \u003coption value=\"available\">有可更新插件\u003c/option>",
  "          \u003coption value=\"latest\">全部已是最新\u003c/option>",
  "          \u003coption value=\"partial\">部分更新失败\u003c/option>",
  "        \u003c/select>",
  "      \u003c/label>",
  "      \u003cbutton id=\"theme\" class=\"icon-button\" aria-label=\"切换明暗主题\" title=\"切换明暗主题\">\u003c/button>",
  "    \u003c/div>",
  "  \u003c/header>",
  "  \u003cmain class=\"workspace\">",
  "    \u003cdiv class=\"page-heading\">",
  "      \u003cdiv>\u003ch1>插件\u003c/h1>\u003cp>管理已安装的插件。\u003c/p>\u003c/div>",
  "      \u003cbutton id=\"open\" class=\"button primary\">\u003csvg class=\"icon\">\u003cuse href=\"#i-download\"/>\u003c/svg>一键更新\u003c/button>",
  "    \u003c/div>",
  "    \u003cdiv id=\"background-plugins\" class=\"background-grid\" aria-label=\"已安装插件示例\">\u003c/div>",
  "  \u003c/main>",
  "  \u003cdialog id=\"update-dialog\" aria-labelledby=\"dialog-title\" aria-describedby=\"dialog-description\">",
  "    \u003cheader class=\"dialog-header\">",
  "      \u003cdiv>\u003ch2 id=\"dialog-title\">更新已安装插件\u003c/h2>\u003cp id=\"dialog-description\">只更新用户安装的插件，保留各自的安装源与启用状态。\u003c/p>\u003c/div>",
  "      \u003cbutton id=\"close\" class=\"icon-button\" aria-label=\"关闭更新弹窗\">\u003csvg class=\"icon\">\u003cuse href=\"#i-x\"/>\u003c/svg>\u003c/button>",
  "    \u003c/header>",
  "    \u003cdiv class=\"status-strip\" role=\"status\" aria-live=\"polite\">",
  "      \u003cspan id=\"status-icon\">\u003c/span>\u003cdiv>\u003cstrong id=\"status-title\">\u003c/strong>\u003cspan id=\"status-detail\">\u003c/span>\u003c/div>",
  "      \u003cspan id=\"progress-count\">\u003c/span>",
  "    \u003c/div>",
  "    \u003cdiv id=\"groups\" class=\"dialog-scroll\" tabindex=\"0\" aria-label=\"插件分组列表\">\u003c/div>",
  "    \u003cfooter class=\"dialog-footer\">",
  "      \u003cp class=\"shared-notice\">\u003csvg class=\"icon\">\u003cuse href=\"#i-alert\"/>\u003c/svg>\u003cspan id=\"shared-notice\">更新期间插件可能短暂停止。安装失败时会保留或重新安装原版本；需要重启的插件将在结果中提示。\u003c/span>\u003c/p>",
  "      \u003cdiv class=\"footer-actions\">\u003cspan id=\"footer-detail\">\u003c/span>\u003cdiv id=\"actions\">\u003c/div>\u003c/div>",
  "    \u003c/footer>",
  "  \u003c/dialog>",
  "\u003cscript>",
  "/* 仅用于布局演示；以下版本不代表实时发布信息。 */",
  "window.PLUGIN_FIXTURES = [",
  "  { id:'pet', name:'dsh-pet', current:'0.3.8', target:'0.4.7', registry:null, status:'available' },",
  "  { id:'archive', name:'Archive Manager', package:'@michengai/dsh-archive-manager', current:'1.1.22', target:'1.2.8', registry:null, status:'available' },",
  "  { id:'skills', name:'Skills Manager', package:'@michengai/dsh-skills-manager', current:'1.2.26', target:'1.3.0', registry:'国内镜像源', status:'available' },",
  "  { id:'market', name:'dshmarket', current:'1.73.16', target:'1.74.0', registry:null, status:'available' },",
  "  { id:'context', name:'dsh-context', current:'0.83.0', registry:null, status:'current' },",
  "  { id:'billion', name:'billion-context', current:'0.1.212', registry:null, status:'current' },",
  "  { id:'terminal', name:'Terminal Tools', current:'1.4.2', registry:'npm 官方源', status:'current' },",
  "  { id:'notes', name:'Workspace Notes', current:'2.1.0', registry:null, status:'current' },",
  "  { id:'workbase', name:'dsh-workbase', current:'0.3.1', registry:'本地安装包', status:'skipped' },",
  "];",
  "",
  "\u003c/script>",
  "\u003cscript>",
  "/* 模拟官方pluginManager接口形状。全程不请求网络、不操作真实插件。",
  "   接入真实宿主时将这层替换为remote.pluginManager，保留UI状态机。 */",
  "window.MockApi = {",
  "  async listBundles() {",
  "    await new Promise(resolve => setTimeout(resolve, 240));",
  "    return window.PLUGIN_FIXTURES.map(item => ({ ...item }));",
  "  },",
  "  async listVersions(bundle, scenario) {",
  "    await new Promise(resolve => setTimeout(resolve, 90));",
  "    return { ...bundle, ...(scenario === 'latest' && bundle.status === 'available'",
  "      ? { status:'current', current:bundle.target, target:undefined } : {}) };",
  "  },",
  "  async updateBundle(bundle, scenario, onProgress) {",
  "    for (const step of ['检查版本','安装更新']) {",
  "      onProgress(step);",
  "      await new Promise(resolve => setTimeout(resolve, 550));",
  "    }",
  "    if (scenario === 'partial' && bundle.id === 'skills') {",
  "      onProgress('恢复旧版');",
  "      await new Promise(resolve => setTimeout(resolve, 550));",
  "      return { status:'failed', detail:'安装未完成，已恢复 ' + bundle.current };",
  "    }",
  "    return bundle.id === 'archive'",
  "      ? { status:'restart', detail:'已更新至 ' + bundle.target + '，重启 Harness 后生效' }",
  "      : { status:'updated', detail:'已更新至 ' + bundle.target };",
  "  },",
  "};",
  "",
  "\u003c/script>",
  "\u003cscript>",
  "(() => {",
  "  const dialog = document.getElementById('update-dialog');",
  "  const groups = document.getElementById('groups');",
  "  const openButton = document.getElementById('open');",
  "  const scenarioSelect = document.getElementById('scenario');",
  "  const themeButton = document.getElementById('theme');",
  "  const closeButton = document.getElementById('close');",
  "  const state = { phase:'ready', items:[], scenario:'available', targetOpen:true, latestOpen:false, otherOpen:false, checked:0, focus:null };",
  "  const escape = value => String(value ?? '').replace(/[&\u003c>\"']/g, char => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[char]));",
  "  const icon = (name, classes = '') => `\u003csvg class=\"icon ${classes}\" aria-hidden=\"true\">\u003cuse href=\"#i-${name}\"/>\u003c/svg>`;",
  "  const labels = { available:'可更新', current:'已是最新', waiting:'等待更新', updating:'正在更新', updated:'更新完成', restart:'需重启', failed:'更新失败', skipped:'已跳过' };",
  "  const isBusy = () => ['checking','updating'].includes(state.phase);",
  "  const target = item => !!item.target;",
  "  function card(item) {",
  "    const success = ['current','updated'].includes(item.status);",
  "    const tone = item.status === 'failed' ? 'error' : item.status === 'restart' ? 'warning' : success ? 'success' : '';",
  "    const badge = `${success ? icon('check') : item.status === 'updating' ? icon('refresh','spin') : ''}${escape(labels[item.status])}`;",
  "    return `\u003carticle class=\"plugin-card ${!item.target ? 'compact-card' : ''}\" data-plugin=\"${escape(item.id)}\">",
  "      \u003cdiv class=\"card-heading\">${icon('puzzle')}\u003ch3 title=\"${escape(item.package ?? item.name)}\">${escape(item.name)}\u003c/h3>\u003cspan class=\"badge\" data-tone=\"${tone}\">${badge}\u003c/span>\u003c/div>",
  "      \u003cdiv class=\"version-pair\" aria-label=\"${escape(item.current + (item.target ? ' 更新至 ' + item.target : ' 当前版本'))}\">",
  "        \u003cspan ${item.target ? 'data-old' : ''}>${escape(item.current)}\u003c/span>${item.target ? icon('chevron-right') + '\u003cspan>' + escape(item.target) + '\u003c/span>' : ''}",
  "      \u003c/div>",
  "      \u003cdl class=\"source\">\u003cdt>安装来源\u003c/dt>\u003cdd title=\"${escape(item.registry ?? '默认安装源')}\">${escape(item.registry ?? '默认安装源')}\u003c/dd>\u003c/dl>",
  "      ${item.status === 'updating' ? `\u003col class=\"step-list\">${['检查版本','安装更新','恢复旧版'].filter(step => step !== '恢复旧版' || item.step === step).map(step => `\u003cli ${item.step === step ? 'data-active' : ''}>${item.step === step ? icon('refresh','spin') : step === '检查版本' || item.step === '恢复旧版' ? icon('check') : ''}${step}\u003c/li>`).join('')}\u003c/ol>` : ''}",
  "      ${item.detail || item.status === 'skipped' ? `\u003cp class=\"item-result\" data-tone=\"${tone}\">${escape(item.detail ?? '当前安装来源不支持在线更新')}\u003c/p>` : ''}",
  "    \u003c/article>`;",
  "  }",
  "  function section(id, title, items, open, hint) {",
  "    return `\u003csection class=\"group\" data-group=\"${id}\" data-open=\"${open}\">\u003cbutton class=\"group-heading\" aria-expanded=\"${open}\" aria-controls=\"group-${id}\">${icon('chevron-right')}\u003cspan class=\"group-title\">${title}\u003c/span>\u003cspan class=\"group-count\">${items.length}\u003c/span>\u003cspan class=\"group-hint\">${hint}\u003c/span>\u003c/button>\u003cdiv class=\"group-scroll\" id=\"group-${id}\" ${open ? '' : 'hidden'} tabindex=\"0\" role=\"region\" aria-label=\"${title}插件\">\u003cdiv class=\"card-grid\">${items.map(card).join('')}\u003c/div>\u003c/div>\u003c/section>`;",
  "  }",
  "  function render() {",
  "    const targets = state.items.filter(target);",
  "    const latest = state.items.filter(item => item.status === 'current' && !item.target);",
  "    const other = state.items.filter(item => item.status === 'skipped');",
  "    const updated = targets.filter(item => ['updated','restart'].includes(item.status)).length;",
  "    const failed = targets.filter(item => item.status === 'failed').length;",
  "    const done = updated + failed;",
  "    const statusTitle = state.phase === 'checking' ? '正在检查已安装插件'",
  "      : state.phase === 'updating' ? '正在更新插件'",
  "      : state.phase === 'done' ? `更新结束，${updated} 个成功${failed ? `，${failed} 个失败` : ''}`",
  "      : targets.length ? `检查完成，${targets.length} 个插件可以更新` : '检查完成，暂无可更新插件';",
  "    document.getElementById('status-title').textContent = statusTitle;",
  "    document.getElementById('status-detail').textContent = state.phase === 'checking' ? '逐个检查兼容的正式版本。'",
  "      : state.phase === 'updating' ? '关闭弹窗后仍会继续更新，再次打开可查看进度。'",
  "      : state.phase === 'done' ? targets.some(item => item.status === 'restart') ? '部分插件需要重启 Harness 后生效。' : '各插件的更新结果已保留。'",
  "      : `已是最新 ${latest.length} 个${other.length ? ` · 跳过更新 ${other.length} 个` : ''}`;",
  "    document.getElementById('status-icon').innerHTML = icon(isBusy() ? 'refresh' : failed ? 'alert' : 'check',isBusy() ? 'spin' : '');",
  "    document.getElementById('status-icon').style.color = failed ? 'var(--error)' : 'var(--success)';",
  "    document.getElementById('progress-count').textContent = state.phase === 'updating' ? `${done} / ${targets.length}`",
  "      : state.phase === 'checking' ? `${state.checked} / ${window.PLUGIN_FIXTURES.length}` : '';",
  "    const scrollPositions = new Map([...groups.querySelectorAll('[data-group]')].map(node => [node.dataset.group,node.querySelector('.group-scroll')?.scrollTop ?? 0]));",
  "    groups.innerHTML = state.phase === 'checking'",
  "      ? `\u003cdiv class=\"empty-state\">${icon('refresh','spin')}\u003cp>正在检查新版本\u003c/p>\u003csmall>检查完成后显示可更新插件。\u003c/small>\u003c/div>`",
  "      : (targets.length ? section('target',state.phase === 'ready' ? '可以更新' : state.phase === 'done' ? '更新结果' : '正在更新',targets,state.targetOpen,'兼容当前 Harness 的正式版本')",
  "        : `\u003cdiv class=\"empty-state\">${icon('check')}\u003cp>当前没有可更新的插件\u003c/p>\u003csmall>展开下方分组查看已安装版本。\u003c/small>\u003c/div>`)",
  "        + section('latest','已是最新',latest,state.latestOpen,'无需更新')",
  "        + (other.length ? section('other','跳过更新',other,state.otherOpen,'本地来源等') : '');",
  "    for (const node of groups.querySelectorAll('[data-group]')) node.querySelector('.group-scroll').scrollTop = scrollPositions.get(node.dataset.group) ?? 0;",
  "    for (const node of groups.querySelectorAll('[data-group]')) node.querySelector('.group-heading').addEventListener('click',() => {",
  "      const key = {target:'targetOpen',latest:'latestOpen',other:'otherOpen'}[node.dataset.group];",
  "      const nextOpen = !state[key];",
  "      state.targetOpen = false;state.latestOpen = false;state.otherOpen = false;",
  "      state[key] = nextOpen;",
  "      for (const group of groups.querySelectorAll('[data-group]')) {",
  "        const open = group === node && nextOpen;",
  "        group.dataset.open = String(open);",
  "        group.querySelector('.group-heading').setAttribute('aria-expanded',String(open));",
  "        group.querySelector('.group-scroll').hidden = !open;",
  "      }",
  "    });",
  "    closeButton.disabled = false;",
  "    openButton.textContent = isBusy() ? '查看更新进度' : '一键更新';",
  "    scenarioSelect.disabled = isBusy();",
  "    document.getElementById('footer-detail').textContent = state.phase === 'updating' ? `已处理 ${done} / ${targets.length}` : state.phase === 'ready' && targets.length ? `${targets.length} 个插件等待更新` : '保留原启用状态';",
  "    document.getElementById('actions').innerHTML = isBusy()",
  "      ? `\u003cbutton class=\"button\" data-action=\"close\">后台${state.phase === 'checking' ? '检查' : '更新'}\u003c/button>\u003cbutton class=\"button\" disabled>${icon('refresh','spin')}${state.phase === 'checking' ? '正在检查…' : '正在更新…'}\u003c/button>`",
  "      : state.phase === 'ready' && targets.length ? `\u003cbutton class=\"button\" data-action=\"close\">取消\u003c/button>\u003cbutton class=\"button primary\" data-action=\"update\">${icon('download')}更新全部（${targets.length}）\u003c/button>`",
  "      : `\u003cbutton class=\"button\" data-action=\"check\">重新检查\u003c/button>\u003cbutton class=\"button primary\" data-action=\"close\">完成\u003c/button>`;",
  "  }",
  "  async function check() {",
  "    if (isBusy()) return;",
  "    state.phase = 'checking';state.checked = 0;state.items = [];",
  "    state.targetOpen = true;state.latestOpen = false;state.otherOpen = false;",
  "    render();",
  "    const bundles = await window.MockApi.listBundles();",
  "    for (const bundle of bundles) {",
  "      state.items.push(await window.MockApi.listVersions(bundle,state.scenario));",
  "      state.checked++;render();",
  "    }",
  "    state.phase = 'ready';render();",
  "  }",
  "  async function update() {",
  "    if (isBusy()) return;",
  "    const targets = state.items.filter(item => item.status === 'available');",
  "    if (!targets.length) return;",
  "    state.phase = 'updating';state.targetOpen = true;state.latestOpen = false;state.otherOpen = false;",
  "    for (const item of targets) item.status = 'waiting';",
  "    render();",
  "    for (const item of targets) {",
  "      item.status = 'updating';item.step = '检查版本';render();",
  "      const result = await window.MockApi.updateBundle(item,state.scenario,step => { item.step = step;render(); });",
  "      Object.assign(item,result);render();",
  "    }",
  "    state.phase = 'done';render();",
  "  }",
  "  function close() {",
  "    dialog.close();(state.focus ?? openButton).focus();",
  "  }",
  "  function open() {",
  "    if (!dialog.open) { state.focus = document.activeElement;dialog.showModal();closeButton.focus(); }",
  "    if (!state.items.length && !isBusy()) void check();",
  "  }",
  "  function theme(value) {",
  "    document.documentElement.dataset.theme = value;",
  "    themeButton.innerHTML = icon(value === 'dark' ? 'sun' : 'moon');",
  "    try { localStorage.setItem('plugin-update-preview-theme',value); } catch { /* 离线隐私模式沿用当前主题。 */ }",
  "  }",
  "  let remembered = 'dark';",
  "  try { remembered = localStorage.getItem('plugin-update-preview-theme') === 'light' ? 'light' : 'dark'; } catch { /* 保留默认。 */ }",
  "  theme(remembered);",
  "  themeButton.addEventListener('click',() => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));",
  "  scenarioSelect.addEventListener('change',() => {",
  "    state.scenario = scenarioSelect.value;",
  "    if (dialog.open) void check();",
  "    else { state.phase = 'ready';state.items = []; }",
  "  });",
  "  groups.addEventListener('keydown',event => { if (event.key === 'Escape') close(); });",
  "  document.getElementById('actions').addEventListener('click',event => {",
  "    const action = event.target.closest('[data-action]')?.dataset.action;",
  "    if (action === 'close') close();",
  "    else if (action === 'update') void update();",
  "    else if (action === 'check') void check();",
  "  });",
  "  dialog.addEventListener('cancel',event => { event.preventDefault();close(); });",
  "  closeButton.addEventListener('click',close);",
  "  openButton.addEventListener('click',open);",
  "  document.getElementById('background-plugins').innerHTML = window.PLUGIN_FIXTURES.slice(0,6).map(item => `\u003carticle class=\"background-card\">${icon('puzzle')}\u003cstrong>${escape(item.name)}\u003c/strong>\u003csmall>${escape(item.current)} · 已启用\u003c/small>\u003c/article>`).join('');",
  "  open();",
  "})();",
  "",
  "\u003c/script>",
  "\u003cscript>",
  "document.addEventListener('click',event=>{",
  "  const link=event.target.closest('[data-demo-link]');",
  "  if(!link)return;",
  "  event.preventDefault();",
  "  parent.postMessage({type:'workbase-demo-navigation',id:link.dataset.demoLink},'*');",
  "});",
  "\u003c/script>",
  "\u003c/body>",
  "\u003c/html>",
  ""
]
</script>

[
  "\u003c!doctype html>",
  "\u003chtml lang=\"zh-CN\">",

  "  \u003cmeta charset=\"utf-8\">",
  "  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">",

  "  \u003cstyle data-demo-style>",
  ":root{color-scheme:dark;--bg:#1b1c1f;--surface:#242528;--field:#202124;--line:#36373b;--text:#ececef;--muted:#979ba5;--accent:#aa88ff;--hover:#2e2f34;--danger:#ed858d;--success:#9ac8ad;--shadow:0 24px 80px #0005}",

  "\u003cscript>",
  "/* 原型内存数据；刷新会重置，不访问用户工作台。 */",
  "window.TodoMock = (() => {",
  "  const todos = [",
  "    {id:'1',title:'1344',note:'',priority:'',done:false,creator:'用户',time:'刚刚',images:[]},",
  "    {id:'2',title:'验证图片上传失败后的继续上传',note:'## 背景\\n网络中断后，应保留已上传图片和待上传文件。\\n## 验收标准\\n- [ ] 重试后继续同一条待办\\n- [ ] 上传期间禁用发送\\n- [ ] 已上传图片不重复添加',priority:'high',done:false,creator:'Agent',time:'12 分钟前',images:[]},",
  "    {id:'3',title:'核对窄面板下的待办操作位置',note:'在 360px 面板中，保存与发起会话保持同一行。\\n不要让模式选择器占满整行。',priority:'medium',done:false,creator:'用户',time:'25 分钟前',images:[]},",
  "    {id:'4',title:'整理项目会话中的下一步',note:'把可独立验收的步骤记录为待办，先查询已有条目避免重复。',priority:'',done:false,creator:'Agent',time:'1 小时前',images:[]},",
  "    {id:'5',title:'补充待办 Markdown 使用示例',note:'## 实施步骤\\n使用 `Markdown` 记录背景与验收标准。\\n- [ ] 展示标题\\n- [ ] 展示清单\\n- [ ] 保留原始文本',priority:'low',done:false,creator:'用户',time:'2 小时前',images:[]},",
  "    {id:'6',title:'确认新建会话只准备草稿',note:'## 验收标准\\n- [x] 用户可以修改草稿\\n- [x] 不自动发送内容',priority:'high',done:true,creator:'Agent',time:'昨天',images:[]},",
  "    {id:'7',title:'统一备份恢复的控件对齐',note:'父级与子级控件共用右边界。',priority:'',done:true,creator:'用户',time:'昨天',images:[]},",
  "    {id:'8',title:'核对待办权限提示',note:'权限受限时仍可查询已有待办。',priority:'medium',done:true,creator:'Agent',time:'昨天',images:[]},",
  "  ];",
  "  const delay = () => new Promise(resolve => setTimeout(resolve,280));",
  "  return {",
  "    todos,",
  "    // TODO 接入现有 RPC op=create/update；输入待办字段，返回持久化后的 Todo。",
  "    async save(value) {",
  "      await delay();",
  "      if (!value.title.trim()) throw new Error('请填写待办标题');",
  "      const next={...value,title:value.title.trim(),id:value.id||crypto.randomUUID(),time:value.time||'刚刚',creator:value.creator||'用户'};",
  "      const i=todos.findIndex(item=>item.id===next.id);",
  "      if(i\u003c0) todos.unshift(next); else todos[i]=next;",
  "      return next;",
  "    },",
  "    // TODO 接入 openTodoSession(todo,preset)；仅准备宿主草稿，不发送。",
  "    async draft(todo,preset) {",
  "      await delay();",
  "      return {preset,text:`# ${todo.title}\\n\\n${todo.note || '请协助推进这项待办。'}`,images:todo.images.length};",
  "    },",
  "  };",
  "})();",
  "",
  "\u003c/script>",
  "\u003cscript>",
  "(() => {",
  "  'use strict';",
  "  const $=id=>document.getElementById(id);",
  "  const db=window.TodoMock;",
  "  const paths={",
  "    plus:'\u003cpath d=\"M12 5v14M5 12h14\"/>',",
  "    x:'\u003cpath d=\"m18 6-12 12M6 6l12 12\"/>',",
  "    search:'\u003ccircle cx=\"11\" cy=\"11\" r=\"8\"/>\u003cpath d=\"m21 21-4.3-4.3\"/>',",
  "    bot:'\u003cpath d=\"M12 8V4H8\"/>\u003crect x=\"4\" y=\"8\" width=\"16\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M2 14h2m16 0h2M9 13v2m6-2v2\"/>',",
  "    circle:'\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>',",
  "    check:'\u003cpath d=\"m20 6-11 11-5-5\"/>',",
  "    chevron:'\u003cpath d=\"m9 18 6-6-6-6\"/>',",
  "    'chevron-down':'\u003cpath d=\"m6 9 6 6 6-6\"/>',",
  "    eye:'\u003cpath d=\"M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>',",
  "    pencil:'\u003cpath d=\"m16 3 5 5-12 12-6 1 1-6Z\"/>\u003cpath d=\"m14 5 5 5\"/>',",
  "    image:'\u003crect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/>\u003ccircle cx=\"9\" cy=\"9\" r=\"2\"/>\u003cpath d=\"m21 15-5-5L5 21\"/>',",
  "    paperclip:'\u003cpath d=\"m21 11-9 9a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 0 1-2.9-2.9l8.5-8.5\"/>',",
  "    file:'\u003cpath d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z\"/>\u003cpath d=\"M14 2v6h6M8 13h8M8 17h6\"/>',",
  "    'image-plus':'\u003cpath d=\"M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8M19 1v6m-3-3h6\"/>\u003ccircle cx=\"9\" cy=\"9\" r=\"2\"/>\u003cpath d=\"m21 15-5-5L5 21\"/>',",
  "    'message-square':'\u003cpath d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z\"/>',",
  "    folder:'\u003cpath d=\"M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z\"/>',",
  "    clock:'\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 7v5l3 2\"/>',",
  "    list:'\u003cpath d=\"M9 6h12M9 12h12M9 18h12M3 6h.01M3 12h.01M3 18h.01\"/>',",
  "    trash:'\u003cpath d=\"M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6m4-6v6\"/>',",
  "  };",
  "  const icon=name=>`\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">${paths[name]||paths.circle}\u003c/svg>`;",
  "  const escape=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));",
  "  document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));",
  "  const labels={high:'高',medium:'中',low:'低'};",
  "  let edit=null,preview=false,busy=false,dirty=false,focusBefore=null,toastTimer;",
  "  const collapsed={pending:false,done:true};",
  "  function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2400);}",
  "  function renderList(){",
  "    const query=$('query').value.trim().toLowerCase(),priority=$('priority-filter').value;",
  "    const filtered=db.todos.filter(t=>(priority==='all'||t.priority===priority)&&`${t.title} ${t.note}`.toLowerCase().includes(query));",
  "    $('priority-filter').dataset.active=String(priority!=='all');",
  "    $('pending-count').textContent=db.todos.filter(t=>!t.done).length;",
  "    $('visible-count').textContent=`${filtered.length} 条`;",
  "    $('todo-list').innerHTML=['pending','done'].map(group=>{",
  "      const done=group==='done',items=filtered.filter(t=>t.done===done),total=items.length;",
  "      return `\u003cbutton type=\"button\" class=\"group-heading\" data-group=\"${group}\" aria-expanded=\"${!collapsed[group]}\" aria-controls=\"group-${group}\">${icon('chevron')}${done?'已完成':'待处理'}\u003cspan class=\"group-count\">${total}\u003c/span>\u003c/button>\u003cdiv class=\"group-list\" id=\"group-${group}\" ${collapsed[group]?'hidden':''}>${items.length?items.map(t=>`\u003carticle class=\"todo-row ${t.done?'done':''}\">\u003cbutton type=\"button\" class=\"check-button\" data-toggle=\"${t.id}\" aria-label=\"${t.done?'重新打开':'完成'}：${escape(t.title)}\">${t.done?icon('check'):''}\u003c/button>\u003cdiv class=\"todo-copy\">\u003cdiv class=\"row-title\">\u003cbutton type=\"button\" class=\"todo-title\" data-open=\"${t.id}\">${escape(t.title)}\u003c/button>${t.priority?`\u003cspan class=\"priority-tag ${t.priority}\">${labels[t.priority]}\u003c/span>`:''}\u003c/div>\u003cdiv class=\"todo-meta\">\u003cspan>${escape(t.creator)} · ${escape(t.time)}\u003c/span>${t.note?`\u003cspan>${icon('pencil')}备注\u003c/span>`:''}${t.images.length?`\u003cspan>${icon('image')}${t.images.length}\u003c/span>`:''}\u003c/div>\u003c/div>\u003cbutton type=\"button\" class=\"todo-delete\" data-delete=\"${t.id}\" aria-label=\"删除待办：${escape(t.title)}\" title=\"删除待办\">${icon('trash')}\u003c/button>\u003c/article>`).join(''):'\u003cp class=\"empty\">没有符合条件的待办\u003c/p>'}\u003c/div>`;",
  "    }).join('');",
  "  }",
  "  function capture(){",
  "    if(!edit)return;",
  "    edit.title=$('detail-title').value;edit.note=$('note').value;",
  "  }",
  "  function markDirty(){capture();dirty=true;$('save-state').textContent='有未保存修改';}",
  "  function status(){",
  "    $('status').dataset.done=String(edit.done);",
  "    $('status').firstElementChild.innerHTML=icon(edit.done?'check':'circle');",
  "    $('status-label').textContent=edit.done?'已完成':'待处理';",
  "  }",
  "  function renderPriority(){",
  "    $('priority-value').textContent=edit.priority?`${labels[edit.priority]}优先级`:'未设置';",
  "    $('priority-dot').className=`priority-dot ${edit.priority}`;",
  "    $('priority-menu').querySelectorAll('[data-priority]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.priority===edit.priority)));",
  "  }",
  "  function markdown(text){",
  "    if(!text.trim())return '\u003cp class=\"subtle\">暂无备注\u003c/p>';",
  "    return text.split('\\n').map(line=>{",
  "      const safe=escape(line).replace(/`([^`]+)`/g,'\u003ccode>$1\u003c/code>').replace(/\\*\\*([^*]+)\\*\\*/g,'\u003cstrong>$1\u003c/strong>');",
  "      if(/^#{1,3} /.test(line))return `\u003ch3>${safe.replace(/^#{1,3} /,'')}\u003c/h3>`;",
  "      if(/^- \\[[ x]\\] /.test(line))return `\u003cp class=\"checkline\">${line[3]==='x'?'☑':'□'} ${safe.slice(6)}\u003c/p>`;",
  "      return `\u003cp>${safe||'\u003cbr>'}\u003c/p>`;",
  "    }).join('');",
  "  }",
  "  function setPreview(value){",
  "    capture();preview=value;$('note').hidden=value;$('markdown').hidden=!value;",
  "    $('markdown').innerHTML=markdown(edit.note);",
  "    $('preview-label').textContent=value?'编辑':'预览';",
  "    $('preview').firstElementChild.innerHTML=icon(value?'pencil':'eye');",
  "  }",
  "  function renderImages(){",
  "    $('image-count').textContent=`${edit.images.length} / 10`;",
  "    $('image-grid').replaceChildren();",
  "    edit.images.forEach((image,i)=>{",
  "      const card=document.createElement('div');card.className='image-card';",
  "      const fallback=document.createElement('div');fallback.className='file-preview';fallback.innerHTML=icon('file');",
  "      let visual=fallback;",
  "      if(image.type?.startsWith('image/')){",
  "        const img=document.createElement('img');img.src=image.url;img.alt=image.name;",
  "        img.onerror=()=>img.replaceWith(fallback);visual=img;",
  "      }",
  "      const remove=document.createElement('button');remove.type='button';remove.setAttribute('aria-label',`移除 ${image.name}`);remove.innerHTML=icon('x');",
  "      remove.onclick=()=>{edit.images.splice(i,1);renderImages();markDirty();};",
  "      const name=document.createElement('small');name.textContent=image.name;name.title=image.name;",
  "      const size=document.createElement('small');size.className='file-size';",
  "      size.textContent=image.size\u003c1024?`${image.size} B`:image.size\u003c1024*1024?`${(image.size/1024).toFixed(1)} KiB`:`${(image.size/1024/1024).toFixed(1)} MiB`;",
  "      card.append(visual,remove,name,size);$('image-grid').append(card);",
  "    });",
  "    $('drop-zone').hidden=edit.images.length>=10;",
  "  }",
  "  function open(id){",
  "    const todo=id?db.todos.find(t=>t.id===id):null;",
  "    if(id&&!todo)return;",
  "    focusBefore=document.activeElement;",
  "    edit=todo?{...todo,images:[...todo.images]}:{id:'',title:'',note:'',priority:'',done:false,creator:'用户',time:'',images:[]};",
  "    dirty=!todo;preview=!!todo;",
  "    $('dialog-title').textContent=todo?'待办详情':'新建待办';",
  "    $('creator').textContent=todo?`${todo.creator} 创建 · ${todo.time}`:'';",
  "    $('creator-meta').hidden=!todo;",
  "    $('detail-title').value=edit.title;$('note').value=edit.note;",
  "    $('priority-menu').open=false;renderPriority();",
  "    $('save-state').textContent=todo?'未修改':'新待办';",
  "    $('error').hidden=true;$('overlay').hidden=false;document.body.style.overflow='hidden';",
  "    $('detail-content').scrollTop=0;",
  "    status();setPreview(preview);renderImages();$('detail-title').focus();",
  "  }",
  "  function close(){",
  "    if(busy)return;",
  "    $('overlay').hidden=true;$('session-menu').open=false;$('priority-menu').open=false;document.body.style.overflow='';",
  "    edit=null;focusBefore?.focus();",
  "  }",
  "  async function save(){",
  "    capture();",
  "    if(!edit.title.trim()){$('detail-content').scrollTop=0;throw new Error('请填写待办标题');}",
  "    edit=await db.save({...edit,images:[...edit.images]});",
  "    dirty=false;renderList();$('dialog-title').textContent='待办详情';$('creator').textContent=`${edit.creator} 创建 · ${edit.time}`;$('creator-meta').hidden=false;$('save-state').textContent='已保存';",
  "    return edit;",
  "  }",
  "  async function work(fn){",
  "    if(busy)return;",
  "    busy=true;$('error').hidden=true;$('priority-menu').open=false;",
  "    const controls=[...$('detail-form').querySelectorAll('button,input,select,textarea'),$('close')];",
  "    controls.forEach(el=>el.disabled=true);$('save').textContent='保存中…';",
  "    try{await fn();}catch(error){$('error').textContent=error.message;$('error').hidden=false;}",
  "    finally{busy=false;controls.forEach(el=>el.disabled=false);$('save').textContent='保存';}",
  "  }",
  "  function addImages(files){",
  "    if(!edit||busy)return;",
  "    const list=Array.from(files);",
  "    if(!list.length)return;",
  "    if(edit.images.length+list.length>10){$('error').textContent='每个待办最多 10 个附件';$('error').hidden=false;return;}",
  "    if(list.some(f=>f.size>10*1024*1024)){$('error').textContent='每个附件不超过 10 MiB';$('error').hidden=false;return;}",
  "    $('error').hidden=true;",
  "    edit.images.push(...list.map(file=>({name:file.name,type:file.type,size:file.size,url:URL.createObjectURL(file)})));",
  "    renderImages();markDirty();",
  "  }",
  "  $('new').onclick=()=>open();",
  "  $('quick-title').oninput=()=>{$('quick-add').disabled=!$('quick-title').value.trim();};",
  "  $('quick-create').onsubmit=async e=>{",
  "    e.preventDefault();const title=$('quick-title').value.trim();if(!title)return;",
  "    const add=$('quick-add');if(add.disabled)return;add.disabled=true;$('quick-title').disabled=true;",
  "    try{await db.save({title,note:'',priority:'',done:false,images:[]});$('quick-title').value='';renderList();toast('待办已添加');}",
  "    catch(error){toast(error.message);}",
  "    finally{$('quick-title').disabled=false;add.disabled=!$('quick-title').value.trim();$('quick-title').focus();}",
  "  };",
  "  $('query').oninput=renderList;$('priority-filter').onchange=renderList;",
  "  $('todo-list').onclick=async e=>{",
  "    const button=e.target.closest('button');if(!button)return;",
  "    if(button.dataset.group){collapsed[button.dataset.group]=!collapsed[button.dataset.group];renderList();}",
  "    if(button.dataset.open)open(button.dataset.open);",
  "    if(button.dataset.toggle){",
  "      const t=db.todos.find(t=>t.id===button.dataset.toggle);if(!t)return;",
  "      button.disabled=true;await db.save({...t,done:!t.done});renderList();toast(t.done?'待办已重新打开':'待办已完成');",
  "    }",
  "    if(button.dataset.delete){",
  "      const i=db.todos.findIndex(t=>t.id===button.dataset.delete);if(i\u003c0)return;",
  "      const [removed]=db.todos.splice(i,1);renderList();toast('示例待办已删除，刷新页面可恢复');",
  "      removed.images.forEach(image=>URL.revokeObjectURL(image.url));",
  "    }",
  "  };",
  "  $('close').onclick=close;",
  "  $('overlay').onclick=e=>{if(e.target===$('overlay'))close();};",
  "  $('detail-title').oninput=markDirty;$('note').oninput=markDirty;",
  "  $('priority-menu').onclick=e=>{",
  "    if(busy){e.preventDefault();return;}",
  "    const option=e.target.closest('button[data-priority]');if(!option)return;",
  "    edit.priority=option.dataset.priority;renderPriority();markDirty();$('priority-menu').open=false;$('priority-menu').querySelector('summary').focus();",
  "  };",
  "  $('preview').onclick=()=>setPreview(!preview);",
  "  $('images').onchange=e=>{addImages(e.target.files);e.target.value='';};",
  "  $('detail-form').ondragover=e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();$('drop-zone').classList.add('dragging');}};",
  "  $('detail-form').ondragleave=e=>{if(!e.currentTarget.contains(e.relatedTarget))$('drop-zone').classList.remove('dragging');};",
  "  $('detail-form').ondrop=e=>{e.preventDefault();$('drop-zone').classList.remove('dragging');addImages(e.dataTransfer.files);};",
  "  $('detail-form').onpaste=e=>{if(e.clipboardData.files.length){e.preventDefault();addImages(e.clipboardData.files);}};",
  "  $('detail-form').onsubmit=e=>{e.preventDefault();void work(async()=>{await save();toast('已保存');});};",
  "  $('start-session').onclick=()=>void work(async()=>{",
  "    const next=dirty?await save():edit,preset=document.querySelector('input[name=preset]:checked').value,result=await db.draft(next,preset);",
  "    $('draft-mode').textContent=`${result.preset} · 示例会话`;$('draft-text').textContent=result.text;",
  "    $('draft-images').textContent=result.images?`附带 ${result.images} 个附件`:'';",
  "    $('overlay').hidden=true;$('draft-overlay').hidden=false;$('session-menu').open=false;$('draft-close').focus();",
  "  });",
  "  $('draft-close').onclick=()=>{$('draft-overlay').hidden=true;$('overlay').hidden=false;$('start-session').focus();};",
  "  $('width').onchange=e=>$('workbase').dataset.width=e.target.value;",
  "  $('layout').onchange=e=>$('workbase').dataset.layout=e.target.value;",
  "  $('theme').onclick=()=>{document.body.classList.toggle('light');$('theme').textContent=document.body.classList.contains('light')?'深色模式':'温暖浅色';};",
  "  document.addEventListener('keydown',e=>{",
  "    const activeOverlay=!$('draft-overlay').hidden?$('draft-overlay'):!$('overlay').hidden?$('overlay'):null;",
  "    if(e.key==='Escape'&&activeOverlay){if(busy)return;if($('priority-menu').open){$('priority-menu').open=false;$('priority-menu').querySelector('summary').focus();return;}if(activeOverlay===$('draft-overlay'))$('draft-close').click();else close();}",
  "    if(e.key==='Tab'&&activeOverlay){",
  "      const targets=[...activeOverlay.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),summary')].filter(el=>el.getClientRects().length);",
  "      const first=targets[0],last=targets.at(-1);",
  "      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}",
  "      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}",
  "    }",
  "  });",
  "  document.addEventListener('click',e=>{if(!$('priority-menu').contains(e.target))$('priority-menu').open=false;});",
  "  window.addEventListener('beforeunload',()=>db.todos.forEach(t=>t.images.forEach(image=>URL.revokeObjectURL(image.url))));",
  "  renderList();",
  "})();",
  "",
  "\u003c/script>",
  "\u003cscript>",
  "document.addEventListener('click',event=>{",
  "  const link=event.target.closest('[data-demo-link]');",
  "  if(!link)return;",
  "  event.preventDefault();",
  "  parent.postMessage({type:'workbase-demo-navigation',id:link.dataset.demoLink},'*');",
  "});",
  "\u003c/script>",
  "\u003c/body>",
  "\u003c/html>",
  ""
]
</script>

  "      \u003cp class=\"design-summary\" id=\"description\">\u003cstrong>共用输入框\u003c/strong>：点击搜索图标，上下翻转切换添加与搜索，输入框和按钮大小不变，搜索图标始终相同。再次点击图标或按 Esc 返回添加，草稿保留。\u003c/p>",
  "      \u003csection class=\"todo-panel compare-panel\" aria-label=\"待办\">",
  "        \u003cheader class=\"panel-heading\">",
  "          \u003cdiv class=\"heading-title\">\u003ch2>待办\u003c/h2>\u003cspan class=\"count\" id=\"count\">\u003c/span>\u003c/div>",
  "          \u003cdetails class=\"permission\">\u003csummary>\u003cspan data-icon=\"bot\">\u003c/span>Agent 权限\u003cspan class=\"permission-chevron\" data-icon=\"down\">\u003c/span>\u003c/summary>\u003cdiv class=\"popover\">\u003cstrong>允许管理待办\u003c/strong>\u003cp>Agent 可在当前项目创建、查询、编辑和删除待办，并修改完成状态。权限在「工作台设置 → 项目配置 → 全局配置」中统一调整。\u003c/p>\u003c/div>\u003c/details>",
  "        \u003c/header>",
  "        \u003cdiv class=\"tools\">",
  "          \u003cform class=\"add-form\" id=\"add-form\">",
  "            \u003cdiv class=\"add-input\">\u003cspan class=\"input-search-icon\" data-icon=\"search\">\u003c/span>\u003cinput id=\"quick-title\" aria-label=\"快速新建待办\" placeholder=\"记下一步，按 Enter 添加…\" maxlength=\"500\">\u003cbutton id=\"quick-add\" type=\"submit\" aria-label=\"添加待办\" disabled>\u003cspan data-icon=\"plus\">\u003c/span>\u003c/button>\u003cbutton id=\"clear-query\" class=\"clear-query\" type=\"button\" aria-label=\"清空搜索\" title=\"清空搜索\">\u003cspan data-icon=\"x\">\u003c/span>\u003c/button>\u003c/div>",
  "            \u003cbutton class=\"full-create\" id=\"new\" type=\"button\">完整新建\u003c/button>",
  "            \u003cselect id=\"mode-priority\" class=\"mode-priority\" aria-label=\"筛选优先级\" title=\"筛选优先级\">\u003coption value=\"all\">全部\u003c/option>\u003coption value=\"high\">高\u003c/option>\u003coption value=\"medium\">中\u003c/option>\u003coption value=\"low\">低\u003c/option>\u003coption value=\"\">未设置\u003c/option>\u003c/select>",
  "          \u003c/form>",
  "          \u003cbutton class=\"mode-toggle\" id=\"mode-toggle\" type=\"button\" aria-label=\"切换为搜索\" title=\"搜索待办\" aria-pressed=\"false\">\u003cspan data-icon=\"search\">\u003c/span>\u003c/button>",
  "          \u003cbutton class=\"reveal-search\" id=\"reveal\" type=\"button\" aria-label=\"展开搜索与筛选\" title=\"搜索与筛选\" aria-expanded=\"false\" aria-controls=\"find-tools\">\u003cspan data-icon=\"search\">\u003c/span>\u003c/button>",
  "          \u003cdiv class=\"find-tools\" id=\"find-tools\">",
  "            \u003clabel class=\"find-input\">\u003cspan data-icon=\"search\">\u003c/span>\u003cinput id=\"query\" type=\"search\" aria-label=\"搜索标题或备注\" placeholder=\"搜索标题或备注\">\u003c/label>",
  "            \u003cselect id=\"priority\" aria-label=\"筛选优先级\">\u003coption value=\"all\">全部优先级\u003c/option>\u003coption value=\"high\">高优先级\u003c/option>\u003coption value=\"medium\">中优先级\u003c/option>\u003coption value=\"low\">低优先级\u003c/option>\u003coption value=\"\">未设置\u003c/option>\u003c/select>",
  "          \u003c/div>",
  "        \u003c/div>",
  "        \u003cdiv id=\"result-summary\" class=\"result-summary\" role=\"status\" hidden>\u003c/div>",
  "        \u003cdiv id=\"list\">\u003c/div>",
  "      \u003c/section>",
  "      \u003cp class=\"prototype-note\">四个方案共用示例数据，可添加、筛选、勾选和查看详情。\u003ca href=\"#demo=todo\" data-demo-link=\"todo\">返回完整待办原型\u003c/a>\u003c/p>",
  "    \u003c/div>",
  "  \u003c/main>",
  "  \u003cdialog class=\"edit-dialog\" id=\"editor\" aria-labelledby=\"editor-title\">",
  "    \u003cform id=\"edit-form\">",
  "      \u003cheader class=\"dialog-header\">\u003ch2 id=\"editor-title\">新建待办\u003c/h2>\u003cbutton type=\"button\" id=\"close\" class=\"icon-button\" aria-label=\"关闭\">\u003cspan data-icon=\"x\">\u003c/span>\u003c/button>\u003c/header>",
  "      \u003cdiv class=\"edit-body\">",
  "        \u003clabel>标题\u003cinput id=\"edit-title\" required maxlength=\"500\" placeholder=\"待办标题\">\u003c/label>",
  "        \u003cdiv class=\"edit-props\">\u003cselect id=\"edit-priority\" aria-label=\"修改优先级\">\u003coption value=\"\">未设置优先级\u003c/option>\u003coption value=\"high\">高优先级\u003c/option>\u003coption value=\"medium\">中优先级\u003c/option>\u003coption value=\"low\">低优先级\u003c/option>\u003c/select>\u003cspan id=\"edit-status\">待处理\u003c/span>\u003c/div>",
  "        \u003clabel>备注\u003ctextarea id=\"edit-note\" maxlength=\"10000\" placeholder=\"背景、实施步骤和验收标准…\">\u003c/textarea>\u003c/label>",
  "      \u003c/div>",
  "      \u003cp id=\"edit-error\" class=\"error\" role=\"alert\" hidden>\u003c/p>",
  "      \u003cfooter class=\"dialog-footer\">\u003cspan class=\"subtle\">默认工作区 · 示例数据\u003c/span>\u003cbutton class=\"primary\" id=\"save\" type=\"submit\">创建\u003c/button>\u003c/footer>",
  "    \u003c/form>",
  "  \u003c/dialog>",
  "  \u003cdiv class=\"toast\" id=\"toast\" role=\"status\" hidden>\u003c/div>",
  "  ",
  "  \u003cscript>",
  "/* 原型内存数据；刷新会重置，不访问用户工作台。 */",
  "window.TodoMock = (() => {",
  "  const todos = [",
  "    {id:'1',title:'1344',note:'',priority:'',done:false,creator:'用户',time:'刚刚',images:[]},",
  "    {id:'2',title:'验证图片上传失败后的继续上传',note:'## 背景\\n网络中断后，应保留已上传图片和待上传文件。\\n## 验收标准\\n- [ ] 重试后继续同一条待办\\n- [ ] 上传期间禁用发送\\n- [ ] 已上传图片不重复添加',priority:'high',done:false,creator:'Agent',time:'12 分钟前',images:[]},",
  "    {id:'3',title:'核对窄面板下的待办操作位置',note:'在 360px 面板中，保存与发起会话保持同一行。\\n不要让模式选择器占满整行。',priority:'medium',done:false,creator:'用户',time:'25 分钟前',images:[]},",
  "    {id:'4',title:'整理项目会话中的下一步',note:'把可独立验收的步骤记录为待办，先查询已有条目避免重复。',priority:'',done:false,creator:'Agent',time:'1 小时前',images:[]},",
  "    {id:'5',title:'补充待办 Markdown 使用示例',note:'## 实施步骤\\n使用 `Markdown` 记录背景与验收标准。\\n- [ ] 展示标题\\n- [ ] 展示清单\\n- [ ] 保留原始文本',priority:'low',done:false,creator:'用户',time:'2 小时前',images:[]},",
  "    {id:'6',title:'确认新建会话只准备草稿',note:'## 验收标准\\n- [x] 用户可以修改草稿\\n- [x] 不自动发送内容',priority:'high',done:true,creator:'Agent',time:'昨天',images:[]},",
  "    {id:'7',title:'统一备份恢复的控件对齐',note:'父级与子级控件共用右边界。',priority:'',done:true,creator:'用户',time:'昨天',images:[]},",
  "    {id:'8',title:'核对待办权限提示',note:'权限受限时仍可查询已有待办。',priority:'medium',done:true,creator:'Agent',time:'昨天',images:[]},",
  "  ];",
  "  const delay = () => new Promise(resolve => setTimeout(resolve,280));",
  "  return {",
  "    todos,",
  "    // TODO 接入现有 RPC op=create/update；输入待办字段，返回持久化后的 Todo。",
  "    async save(value) {",
  "      await delay();",
  "      if (!value.title.trim()) throw new Error('请填写待办标题');",
  "      const next={...value,title:value.title.trim(),id:value.id||crypto.randomUUID(),time:value.time||'刚刚',creator:value.creator||'用户'};",
  "      const i=todos.findIndex(item=>item.id===next.id);",
  "      if(i\u003c0) todos.unshift(next); else todos[i]=next;",
  "      return next;",
  "    },",
  "    // TODO 接入 openTodoSession(todo,preset)；仅准备宿主草稿，不发送。",
  "    async draft(todo,preset) {",
  "      await delay();",
  "      return {preset,text:`# ${todo.title}\\n\\n${todo.note || '请协助推进这项待办。'}`,images:todo.images.length};",
  "    },",
  "  };",
  "})();",
  "",
  "\u003c/script>",
  "\u003cscript>",
  "    (() => {",
  "      'use strict';",
  "      const $=id=>document.getElementById(id),db=window.TodoMock;",
  "      const paths={plus:'\u003cpath d=\"M12 5v14M5 12h14\"/>',search:'\u003ccircle cx=\"11\" cy=\"11\" r=\"8\"/>\u003cpath d=\"m21 21-4.3-4.3\"/>',bot:'\u003cpath d=\"M12 8V4H8\"/>\u003crect x=\"4\" y=\"8\" width=\"16\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M2 14h2m16 0h2M9 13v2m6-2v2\"/>',down:'\u003cpath d=\"m6 9 6 6 6-6\"/>',chevron:'\u003cpath d=\"m9 18 6-6-6-6\"/>',check:'\u003cpath d=\"m20 6-11 11-5-5\"/>',trash:'\u003cpath d=\"M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6m4-6v6\"/>',x:'\u003cpath d=\"m18 6-12 12M6 6l12 12\"/>'};",
  "      const icon=name=>`\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">${paths[name]}\u003c/svg>`;",
  "      const esc=value=>String(value).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));",
  "      document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));",
  "      const descriptions={",
  "        layered:'\u003cstrong>紧凑分层\u003c/strong>：创建独占第一行，搜索与优先级以较轻的样式排在第二行。入口清楚，适合经常同时新建和筛选。',",
  "        inline:'\u003cstrong>单行工具栏\u003c/strong>：宽面板里将创建、搜索和筛选放在一行，列表更靠前。窄面板自动换成两行，所有入口始终可见。',",
  "        ondemand:'\u003cstrong>按需搜索\u003c/strong>：默认只显示创建区和搜索图标，点击图标展开搜索与优先级。适合条目少、筛选不频繁的项目；有筛选条件时图标显示色点。',",
  "        shared:'\u003cstrong>共用输入框\u003c/strong>：点击搜索图标，上下翻转切换添加与搜索，输入框和按钮大小不变，搜索图标始终相同。再次点击图标或按 Esc 返回添加，草稿保留。'",
  "      };",
  "      const labels={high:'高',medium:'中',low:'低'},collapsed={pending:false,done:true};",
  "      let searchOpen=false,searchMode=false,flipBusy=false,createDraft='',edit=null,editorBusy=false,listBusy=false,timer;",
  "      function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2400);}",
  "      function updateTools(){",
  "        const choice=$('workbase').dataset.choice;",
  "        $('find-tools').hidden=choice==='shared'||(choice==='ondemand'&&!searchOpen);",
  "        $('reveal').setAttribute('aria-expanded',String(searchOpen));",
  "        $('reveal').setAttribute('aria-label',searchOpen?'收起搜索与筛选':'展开搜索与筛选');",
  "      }",
  "      function setInputMode(search,focus=true){",
  "        if($('quick-title').disabled)return;",
  "        if(search&&!searchMode)createDraft=$('quick-title').value;",
  "        searchMode=search;$('workbase').dataset.mode=search?'search':'create';",
  "        if(!search){$('query').value='';$('priority').value='all';}",
  "        $('quick-title').value=search?$('query').value:createDraft;",
  "        $('quick-title').placeholder=search?'搜索标题或备注…':'记下一步，按 Enter 添加…';",
  "        $('quick-title').setAttribute('aria-label',search?'搜索标题或备注':'快速新建待办');",
  "        $('mode-priority').value=$('priority').value;",
  "        $('mode-toggle').setAttribute('aria-label',search?'返回添加，清除搜索与筛选':'切换为搜索');",
  "        $('mode-toggle').title=search?'再次点击返回添加（Esc）':'搜索待办';",
  "        $('mode-toggle').setAttribute('aria-pressed',String(search));",
  "        $('quick-add').disabled=search||!$('quick-title').value.trim();",
  "        render();if(focus)$('quick-title').focus();",
  "      }",
  "      async function flipInputMode(search){",
  "        if(flipBusy||$('quick-title').disabled)return;",
  "        if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){setInputMode(search);return;}",
  "        flipBusy=true;const form=$('add-form'),direction=search?1:-1;",
  "        // 翻到侧面时替换内容，两段动画共 300ms；固定布局尺寸，搜索按钮保持静止。",
  "        form.inert=true;$('mode-toggle').focus();",
  "        let animation;",
  "        try{",
  "          animation=form.animate([",
  "            {transform:'perspective(700px) rotateX(0deg)',opacity:1},",
  "            {transform:`perspective(700px) rotateX(${direction*90}deg)`,opacity:.25}",
  "          ],{duration:130,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'});",
  "          await animation.finished;",
  "          setInputMode(search,false);animation.cancel();",
  "          animation=form.animate([",
  "            {transform:`perspective(700px) rotateX(${-direction*90}deg)`,opacity:.25},",
  "            {transform:'perspective(700px) rotateX(0deg)',opacity:1}",
  "          ],{duration:170,easing:'cubic-bezier(0,0,.2,1)',fill:'forwards'});",
  "          await animation.finished;",
  "        }finally{",
  "          animation?.cancel();form.inert=false;flipBusy=false;$('quick-title').focus();",
  "        }",
  "      }",
  "      function render(){",
  "        const query=$('query').value.trim().toLowerCase(),priority=$('priority').value;",
  "        const active=!!query||priority!=='all';",
  "        const filtered=db.todos.filter(t=>(priority==='all'||t.priority===priority)&&`${t.title} ${t.note}`.toLowerCase().includes(query));",
  "        $('priority').dataset.active=String(priority!=='all');$('reveal').dataset.active=String(active);",
  "        $('count').textContent=db.todos.filter(t=>!t.done).length;",
  "        $('result-summary').hidden=!active;$('result-summary').textContent=`筛选结果 · ${filtered.length} 条`;",
  "        $('list').innerHTML=['pending','done'].map(group=>{",
  "          const items=filtered.filter(t=>t.done===(group==='done'));",
  "          if(group==='done'&&!items.length)return '';",
  "          return `\u003cbutton class=\"group-heading\" type=\"button\" data-group=\"${group}\" aria-expanded=\"${!collapsed[group]}\" aria-controls=\"group-${group}\">${icon('chevron')}${group==='done'?'已完成':'待处理'}\u003cspan class=\"group-count\">${items.length}\u003c/span>\u003c/button>\u003cdiv id=\"group-${group}\" ${collapsed[group]?'hidden':''}>${items.length?items.map(t=>`\u003carticle class=\"todo-row ${t.done?'done':''}\">\u003cbutton class=\"check-button\" type=\"button\" data-toggle=\"${esc(t.id)}\" aria-label=\"${t.done?'重新打开':'完成'}：${esc(t.title)}\">${t.done?icon('check'):''}\u003c/button>\u003cdiv class=\"todo-copy\">\u003cdiv class=\"row-title\">\u003cbutton class=\"todo-title\" type=\"button\" data-open=\"${esc(t.id)}\">${esc(t.title)}\u003c/button>${t.priority?`\u003cspan class=\"priority-tag ${t.priority}\">${labels[t.priority]}\u003c/span>`:''}\u003c/div>\u003cdiv class=\"todo-meta\">${esc(t.creator)} 创建 · ${esc(t.time)}${t.note?' · 有备注':''}\u003c/div>\u003c/div>\u003cbutton class=\"todo-delete\" type=\"button\" data-delete=\"${esc(t.id)}\" aria-label=\"删除：${esc(t.title)}\" title=\"删除待办\">${icon('trash')}\u003c/button>\u003c/article>`).join(''):`\u003cp class=\"empty\">${active?'没有符合条件的待办':'暂无待办，记下你的下一步'}\u003c/p>`}\u003c/div>`;",
  "        }).join('');",
  "      }",
  "      function openEditor(todo){",
  "        edit=todo?{...todo,images:[...todo.images]}:{title:'',note:'',priority:'',done:false,images:[]};",
  "        $('editor-title').textContent=todo?'待办详情':'新建待办';$('save').textContent=todo?'保存':'创建';",
  "        $('edit-title').value=edit.title;$('edit-note').value=edit.note;$('edit-priority').value=edit.priority;",
  "        $('edit-status').textContent=edit.done?'已完成 · 状态只读':'待处理 · 状态只读';$('edit-error').hidden=true;$('editor').showModal();",
  "      }",
  "      document.querySelectorAll('button[data-choice]').forEach(button=>button.onclick=()=>{",
  "        if($('quick-title').disabled||flipBusy)return;",
  "        if(searchMode)setInputMode(false,false);",
  "        if(button.dataset.choice==='shared'){$('query').value='';$('priority').value='all';render();}",
  "        $('workbase').dataset.choice=button.dataset.choice;",
  "        document.querySelectorAll('button[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));",
  "        $('description').innerHTML=descriptions[button.dataset.choice];updateTools();",
  "      });",
  "      $('width').onchange=e=>$('workbase').dataset.width=e.target.value;",
  "      $('theme').onclick=()=>{document.body.classList.toggle('light');$('theme').textContent=document.body.classList.contains('light')?'深色模式':'温暖浅色';};",
  "      $('reveal').onclick=()=>{searchOpen=!searchOpen;updateTools();if(searchOpen)$('query').focus();};",
  "      $('query').oninput=render;$('priority').onchange=render;",
  "      $('mode-toggle').onclick=()=>void flipInputMode(!searchMode);",
  "      $('mode-priority').onchange=e=>{$('priority').value=e.target.value;render();};",
  "      $('clear-query').onclick=()=>{$('query').value='';$('quick-title').value='';render();$('quick-title').focus();};",
  "      $('quick-title').oninput=()=>{",
  "        if(searchMode){$('query').value=$('quick-title').value;render();}",
  "        else{createDraft=$('quick-title').value;$('quick-add').disabled=!createDraft.trim();}",
  "      };",
  "      $('quick-title').onkeydown=e=>{",
  "        if(e.key==='Enter'&&e.isComposing)e.preventDefault();",
  "        if(e.key==='Escape'&&searchMode&&!e.isComposing){e.preventDefault();void flipInputMode(false);}",
  "      };",
  "      $('add-form').onsubmit=async e=>{",
  "        e.preventDefault();if(searchMode)return;",
  "        const title=$('quick-title').value.trim();if(!title||$('quick-title').disabled)return;",
  "        $('quick-title').disabled=true;$('quick-add').disabled=true;$('mode-toggle').disabled=true;",
  "        try{await db.save({title,note:'',priority:'',done:false,images:[]});$('quick-title').value='';createDraft='';render();toast('待办已添加');}",
  "        catch(error){toast(error.message);}",
  "        finally{$('quick-title').disabled=false;$('quick-add').disabled=!$('quick-title').value.trim();$('mode-toggle').disabled=false;$('quick-title').focus();}",
  "      };",
  "      $('new').onclick=()=>openEditor();",
  "      $('close').onclick=()=>{if(!editorBusy)$('editor').close();};",
  "      $('editor').addEventListener('cancel',e=>{if(editorBusy)e.preventDefault();});",
  "      $('edit-form').onsubmit=async e=>{",
  "        e.preventDefault();if(editorBusy)return;",
  "        editorBusy=true;const controls=[...$('editor').querySelectorAll('input,select,textarea,button')];controls.forEach(el=>el.disabled=true);$('save').textContent='保存中…';$('edit-error').hidden=true;",
  "        try{await db.save({...edit,title:$('edit-title').value,note:$('edit-note').value,priority:$('edit-priority').value});render();$('editor').close();toast('待办已保存');}",
  "        catch(error){$('edit-error').textContent=error.message;$('edit-error').hidden=false;}",
  "        finally{editorBusy=false;controls.forEach(el=>el.disabled=false);$('save').textContent=edit.id?'保存':'创建';}",
  "      };",
  "      $('list').onclick=async e=>{",
  "        const button=e.target.closest('button');if(!button||listBusy)return;",
  "        if(button.dataset.group){collapsed[button.dataset.group]=!collapsed[button.dataset.group];render();return;}",
  "        const id=button.dataset.open||button.dataset.toggle||button.dataset.delete,todo=db.todos.find(t=>t.id===id);if(!todo)return;",
  "        if(button.dataset.open){openEditor(todo);return;}",
  "        if(button.dataset.delete){db.todos.splice(db.todos.indexOf(todo),1);render();toast('示例待办已删除，刷新页面可恢复');return;}",
  "        listBusy=true;button.disabled=true;",
  "        try{await db.save({...todo,done:!todo.done});render();}",
  "        catch(error){toast(error.message);button.disabled=false;}",
  "        finally{listBusy=false;}",
  "      };",

  "@container workbase (max-width:400px){.filters{gap:8px}.search{padding:0 4px;gap:6px}.create-row .new-button{padding:6px 10px;font-size:12px}.quick-create input{padding:8px 10px;font-size:12px}.quick-create button{width:28px}.workbase[data-layout=original] .create-row .new-button{padding:6px 10px;font-size:12px}}",

  "    .head-copy>.fields{grid-template-columns:minmax(0,1fr)}",

  "    .foot-actions{display:flex;align-items:center;gap:8px}",

  "    .demo-foot button{box-sizing:border-box;flex:none;width:auto;height:36px;min-height:36px;padding:7px 12px;font-size:14px;line-height:20px;border-radius:8px}",
  "    .demo-foot .wb-primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}",

  "    .page-status{color:var(--accent);min-height:24px;margin-top:20px;font-size:12px}",
  "    @container comparison-panel (max-width:450px){",
  "      .demo-head,.demo-body{padding:16px}",
  "      .fields{grid-template-columns:minmax(0,1fr) 104px;gap:8px}",
  "      .demo-foot{padding:12px 16px;flex-wrap:wrap}",
  "      .foot-actions{margin-left:auto;gap:4px}",
  "      .demo-foot>small{width:100%}",
  "    }",
  "  \u003c/style>",
  "\u003c/head>",
  "\u003cbody>",
  "  \u003cheader class=\"preview-bar\">",
  "    \u003cdiv>\u003cstrong>Workbase\u003c/strong>\u003cspan>标题位置对照\u003c/span>\u003c/div>",
  "    \u003cdiv class=\"preview-tools\">",
  "      \u003clabel>对象\u003cselect id=\"kind\">\u003coption value=\"todo\">待办详情\u003c/option>\u003coption value=\"session\" selected>会话预览\u003c/option>\u003c/select>\u003c/label>",
  "      \u003clabel>标题\u003cselect id=\"length\">\u003coption value=\"short\">短标题\u003c/option>\u003coption value=\"long\">长标题\u003c/option>\u003c/select>\u003c/label>",
  "      \u003clabel>面板\u003cselect id=\"width\">\u003coption value=\"wide\">宽面板\u003c/option>\u003coption value=\"mobile\">360px\u003c/option>\u003c/select>\u003c/label>",
  "      \u003cbutton id=\"theme\" type=\"button\">切换浅色\u003c/button>",
  "      \u003ca href=\"#demo=todo\" data-demo-link=\"todo\">原待办原型\u003c/a>",
  "    \u003c/div>",
  "  \u003c/header>",
  "  \u003cmain class=\"comparison\">",
  "    \u003cdiv class=\"intro\">\u003ch1>对象标题应该放在哪里？\u003c/h1>\u003cp id=\"advice\">\u003c/p>\u003c/div>",
  "    \u003cdiv class=\"compare-grid\" id=\"options\">\u003c/div>",
  "    \u003cp class=\"page-status\" id=\"feedback\" role=\"status\" aria-live=\"polite\">\u003c/p>",
  "  \u003c/main>",
  "  \u003cscript>",
  "    const DB = {",
  "      todo: { short: '完善待办附件下载', long: '完善待办附件下载与失败续传，检查全部主题和窄面板中的文件名、错误提示与会话交接行为' },",
  "      session: { short: '待办附件实现方案', long: '讨论待办附件下载、上传失败续传和长文件名显示，并核对全部主题及窄面板的交互一致性' },",
  "      project: '默认工作区',",
  "      note: '背景\\n附件应支持任意文件格式，同时保留图片预览。\\n\\n实施步骤\\n1. 核对文件名和大小的展示。\\n2. 检查下载及上传失败后的续传。\\n3. 确认内容滚动时，保存与关闭操作始终可见。\\n\\n验收标准\\n宽面板与 360px 面板均可操作；长标题不挤压关闭按钮。',",
  "      messages: [",
  "        { role: '用户', text: '附件不仅仅支持图片，另外这里应该不需要有格式限制吧？' },",
  "        { role: '助手', text: '待办附件可以支持任意文件格式。图片保留缩略图，其他文件显示名称和大小。数量与单文件大小限制继续保留。' },",
  "        { role: '用户', text: '开始开发正式代码吧，适配所有主题。' },",
  "        { role: '助手', text: '先调整附件数据及上传流程，再核对主题和布局。会话预览保持只读，底部提供打开会话入口。' }",
  "      ]",
  "    };",
  "    const state = { kind: 'session', length: 'short', title: DB.session.short, priority: '' };",
  "    const byId = id => document.getElementById(id);",
  "    const escape = value => value.replace(/[&\u003c>\"']/g, char => ({ '&':'&amp;', '\u003c':'&lt;', '>':'&gt;', '\"':'&quot;', \"'\":'&#39;' }[char]));",
  "    const icon = name => `\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">${name === 'x' ? '\u003cpath d=\"M18 6 6 18M6 6l12 12\"/>' : '\u003cpath d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/>\u003cpath d=\"M14 2v6h6\"/>'}\u003c/svg>`;",
  "    const titleField = place => `\u003clabel>标题\u003cinput data-title=\"${place}\" aria-label=\"${place === 'head' ? 'Header' : '内容区'}待办标题\" maxlength=\"500\" value=\"${escape(state.title)}\" required>\u003c/label>`;",
  "    const priority = () => `\u003clabel>优先级\u003cselect data-priority aria-label=\"待办优先级\">\u003coption value=\"\">未设置\u003c/option>\u003coption value=\"high\">高优先级\u003c/option>\u003coption value=\"medium\">中优先级\u003c/option>\u003coption value=\"low\">低优先级\u003c/option>\u003c/select>\u003c/label>`;",
  "    const name = () => `\u003ch3 class=\"object-name\" title=\"${escape(state.title)}\">${escape(state.title)}\u003c/h3>`;",
  "    const meta = () => `\u003cdiv class=\"meta\">\u003cspan class=\"status\">${state.kind === 'todo' ? '待处理' : '未归档'}\u003c/span>\u003cspan>${DB.project}\u003c/span>\u003cspan>${state.kind === 'todo' ? '用户创建 · 2 小时前' : '更新于 1 天前'}\u003c/span>\u003c/div>`;",
  "    function render() {",
  "      const todo = state.kind === 'todo';",
  "      byId('advice').textContent = todo",
  "        ? '建议保留在内容区：标题与优先级构成一组编辑字段；header 用来标识「待办详情」。'",
  "        : '会话名称直接作为固定 header 的标题，移除「会话预览」标签；保持单行，超长省略，悬停查看完整名称。';",
  "      byId('options').innerHTML = ['body', 'head'].map(place => {",
  "        const inHead = place === 'head', recommended = todo ? !inHead : inHead;",
  "        const head = inHead",
  "          ? `${todo ? `\u003csmall class=\"kind\">待办详情\u003c/small>\u003cdiv class=\"fields\">${titleField(place)}\u003c/div>` : name()}`",
  "          : todo ? '\u003ch2>待办详情\u003c/h2>' : '\u003ch2>内容区标题方案\u003c/h2>';",
  "        const summary = todo",
  "          ? `\u003cdiv class=\"fields\">${inHead ? '\u003cdiv>\u003c/div>' : titleField(place)}${priority()}\u003c/div>${meta()}`",
  "          : inHead ? meta() : `${name()}${meta()}`;",
  "        const content = todo",
  "          ? `\u003cdiv class=\"section-title\">\u003cstrong>备注\u003c/strong>\u003cbutton type=\"button\" data-action=\"edit\">编辑\u003c/button>\u003c/div>\u003cdiv class=\"note\">${escape(DB.note)}\u003c/div>\u003cdiv class=\"section-title\">\u003cstrong>附件 · 1/10\u003c/strong>\u003csmall>单个不超过 10MiB\u003c/small>\u003c/div>\u003cdiv class=\"attachment\">${icon('file')}\u003cdiv>验收清单.pdf\u003csmall>128 KiB\u003c/small>\u003c/div>\u003c/div>`",
  "          : `\u003cdiv style=\"margin-top:${inHead ? '0' : '24px'}\">${DB.messages.map(m => `\u003carticle class=\"message\">\u003cstrong>${m.role}\u003c/strong>\u003cp>${escape(m.text)}\u003c/p>\u003c/article>`).join('')}\u003c/div>`;",
  "        const foot = todo",
  "          ? `\u003csmall data-save-state>已保存\u003c/small>\u003cdiv class=\"foot-actions\">\u003cselect aria-label=\"会话模式\">\u003coption>标准模式\u003c/option>\u003coption>计划模式\u003c/option>\u003c/select>\u003cbutton type=\"button\" data-action=\"session\">发起会话\u003c/button>\u003cbutton type=\"button\" class=\"wb-primary\" data-action=\"save\">保存\u003c/button>\u003c/div>`",
  "          : `\u003csmall>只读预览\u003c/small>\u003cdiv class=\"foot-actions\">\u003cbutton type=\"button\" data-action=\"close\">关闭\u003c/button>\u003cbutton type=\"button\" class=\"wb-primary\" data-action=\"open\">打开会话\u003c/button>\u003c/div>`;",
  "        const reason = todo",
  "          ? inHead ? '标题输入框进入 header 后，与内容区的优先级分离；header 高度和表单状态也需要一起处理。' : '标题与优先级保持同排，编辑关系清晰；往下滚动时，标题会离开视野。'",
  "          : inHead ? '对象名称在固定 header 单行显示；状态、项目与更新时间合并一行，正文独立滚动。' : '对象名称在正文开头，向下滚动后无法通过 header 定位当前会话。';",
  "        return `\u003csection class=\"option\">\u003cdiv class=\"option-heading\">\u003ch2>${inHead ? 'B · 对象标题在 header' : 'A · 对象标题在内容区'}\u003c/h2>\u003cspan class=\"recommend\">${recommended ? '推荐' : '对照'}\u003c/span>\u003c/div>\u003cdiv class=\"panel\">\u003csection class=\"demo-dialog\" aria-label=\"${inHead ? 'Header' : '内容区'}标题方案\">\u003cheader class=\"demo-head\">\u003cdiv class=\"head-copy\">${head}\u003c/div>\u003cbutton class=\"demo-close\" type=\"button\" data-action=\"close\" aria-label=\"关闭对照弹窗\">${icon('x')}\u003c/button>\u003c/header>\u003cdiv class=\"demo-body\">${summary}${content}\u003c/div>\u003cfooter class=\"demo-foot\">${foot}\u003c/footer>\u003c/section>\u003c/div>\u003cp class=\"reason\">${reason}\u003c/p>\u003c/section>`;",
  "      }).join('');",
  "      document.querySelectorAll('[data-priority]').forEach(el => { el.value = state.priority; });",
  "    }",
  "    ['kind', 'length'].forEach(id => byId(id).addEventListener('change', () => {",
  "      state[id] = byId(id).value; state.title = DB[state.kind][state.length]; byId('feedback').textContent = ''; render();",
  "    }));",
  "    byId('width').addEventListener('change', () => document.body.classList.toggle('mobile', byId('width').value === 'mobile'));",
  "    byId('theme').addEventListener('click', () => {",
  "      const light = document.body.classList.toggle('light'); byId('theme').textContent = light ? '切换深色' : '切换浅色';",
  "    });",
  "    byId('options').addEventListener('input', event => {",
  "      if (!event.target.matches('[data-title]')) return;",
  "      state.title = event.target.value;",
  "      document.querySelectorAll('[data-title]').forEach(el => { if (el !== event.target) el.value = state.title; });",
  "      document.querySelectorAll('[data-save-state]').forEach(el => { el.textContent = '有未保存修改'; });",
  "    });",
  "    byId('options').addEventListener('change', event => {",
  "      if (!event.target.matches('[data-priority]')) return;",
  "      state.priority = event.target.value;",
  "      document.querySelectorAll('[data-priority]').forEach(el => { el.value = state.priority; });",
  "      document.querySelectorAll('[data-save-state]').forEach(el => { el.textContent = '有未保存修改'; });",
  "    });",
  "    byId('options').addEventListener('click', event => {",
  "      const button = event.target.closest('[data-action]');",
  "      if (!button) return;",
  "      const action = button.dataset.action;",
  "      if (action === 'save') {",
  "        byId('feedback').textContent = state.title.trim() ? '示例修改已保存，仅作用于本页。' : '请填写待办标题。';",
  "        if (state.title.trim()) document.querySelectorAll('[data-save-state]').forEach(el => { el.textContent = '已保存'; });",
  "      } else if (action === 'edit') {",
  "        const note = button.closest('.demo-body').querySelector('.note');",
  "        const editing = note.contentEditable !== 'true'; note.contentEditable = String(editing);",
  "        note.setAttribute('aria-label', '示例待办备注'); button.textContent = editing ? '预览' : '编辑';",
  "        if (editing) note.focus();",
  "      } else if (action === 'close') {",
  "        const dialog = button.closest('.demo-dialog'); dialog.hidden = true;",
  "        byId('feedback').textContent = '已关闭此方案；切换对象或标题长度可重新显示。';",
  "      } else {",
  "        byId('feedback').textContent = action === 'session' ? '示例：待办内容将填入会话草稿。' : '示例：从预览进入完整会话。';",
  "      }",
  "    });",
  "    render();",
  "  \u003c/script>",
  "",
  "\u003cscript>",
  "document.addEventListener('click',event=>{",
  "  const link=event.target.closest('[data-demo-link]');",
  "  if(!link)return;",
  "  event.preventDefault();",
  "  parent.postMessage({type:'workbase-demo-navigation',id:link.dataset.demoLink},'*');",
  "});",
  "\u003c/script>",
  "\u003c/body>",
  "\u003c/html>",
  ""
]
</script>
<script type="application/json" id="demo-source-card-tone" data-demo-label="卡片配色与动效">
[
  "\u003c!doctype html>",

  "\u003cmeta charset=\"utf-8\">",
  "\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">",
  "\u003ctitle>Workbase · 连续列表与灰色悬停\u003c/title>",
  "\u003cstyle>",
